<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Store Leads · Just Deals Promotions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101418;--sub:#5b6470;--mute:#8a929c;--line:#e6e8eb;--soft:#f5f6f8;--bg:#fafbfc;--card:#fff;--acc:#d71f2b;--hot:#d71f2b;--hotbg:#fdecee;--warm:#b45309;--warmbg:#fef3e2;--cool:#475569;--coolbg:#eef1f5;--ok:#0f7b4f;--okbg:#e6f5ee;--live:#12a150}
*{box-sizing:border-box}html,body{margin:0}body{font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap}.brand i{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.q{flex:1;min-width:220px;position:relative}.q input{width:100%;border:1px solid #d5d9de;border-radius:10px;padding:10px 14px 10px 38px;font-size:15px;background:#fff}
.q input:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.q svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute)}
.ctl{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px;white-space:nowrap}.ctl select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);display:inline-block}
main{max-width:1080px;margin:0 auto;padding:22px 24px 60px}
h2{font-size:17px;margin:28px 0 4px;letter-spacing:-.01em}h2:first-child{margin-top:4px}.lede{color:var(--sub);margin:0 0 12px;font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:500;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}.btn.call{background:var(--ok);border-color:var(--ok);color:#fff}.btn.sm{padding:4px 9px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card.hot{border-left:4px solid var(--hot)}.card.warm{border-left:4px solid var(--warm)}.card.cool{border-left:4px solid var(--line)}.card.quiet{opacity:.6}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ch h3{margin:0;font-size:16px}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px}.pill.hot{background:var(--hotbg);color:var(--hot)}.pill.warm{background:var(--warmbg);color:var(--warm)}.pill.cool{background:var(--coolbg);color:var(--cool)}
.pill.live{background:var(--okbg);color:var(--ok)}.when{margin-left:auto;color:var(--mute);font-size:12.5px;white-space:nowrap}
.who{margin-top:6px;font-size:13.5px}.who b{font-weight:600}.who span{color:var(--sub)}
.did{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:3px;font-size:13.5px}.did li:before{content:'•';color:var(--mute);margin-right:7px}.did li.h{font-weight:600}.did li.h:before{color:var(--hot)}
.priced{margin-top:8px;background:var(--soft);border-radius:8px;padding:8px 10px;font-size:13px}.priced b{font-variant-numeric:tabular-nums}
.from{margin-top:8px;font-size:12.5px;color:var(--sub)}
.acts2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
details.tl{margin-top:10px}details.tl summary{cursor:pointer;color:var(--sub);font-size:13px;font-weight:600}
.visit{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:10px 0 0}.visit b{font-size:12.5px;color:var(--sub);font-weight:600}.visit div{font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);background:#fff;border-radius:10px;margin-bottom:6px}.row .mu{color:var(--mute);font-size:12.5px}.row .sp{flex:1}
table.src{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
table.src th,table.src td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}table.src th{background:var(--soft);font-weight:600;color:var(--sub);font-size:12px}
table.src td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}table.src th.n{text-align:right}table.src tr:last-child td{border-bottom:0}
.lnk{background:none;border:0;padding:0;color:#1a56c4;cursor:pointer;text-decoration:underline;font-size:12.5px}
.empty{padding:22px;text-align:center;color:var(--sub);background:#fff;border:1px dashed var(--line);border-radius:12px}
details.more>summary{cursor:pointer;font-weight:600;font-size:15px;margin:28px 0 10px;list-style:none}details.more>summary:before{content:'▸ ';color:var(--mute)}details.more[open]>summary:before{content:'▾ '}
.gate{max-width:460px;margin:12vh auto;text-align:center;padding:0 20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;opacity:0;transition:.2s;pointer-events:none;font-size:13px}.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:640px){.bar{padding:10px 14px}main{padding:16px 14px}.when{margin-left:0;width:100%}}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:2px 0 8px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;line-height:1.1}.kpi span{color:var(--sub);font-size:12.5px}.kpi.h b{color:var(--hot)}
.list{display:grid;gap:6px}
.acc{display:grid;grid-template-columns:minmax(150px,1.3fr) auto minmax(0,2fr) minmax(0,1.2fr) 70px;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.acc:hover{border-color:#c8cdd3;background:#fcfcfd}.acc .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acc .dt{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .mt{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acc .ag{font-size:12px;color:var(--mute);text-align:right;white-space:nowrap}
.acc>.dot{justify-self:start}
.two{display:grid;grid-template-columns:3fr 2fr;gap:12px;align-items:start}
.trend{display:flex;gap:6px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 14px 8px;overflow-x:auto}
.wk{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:38px}.wk span{font-size:11px;color:var(--mute)}.bars{display:flex;gap:2px;align-items:flex-end;height:62px}
.bars i,.leg i{display:inline-block;width:8px;border-radius:2px 2px 0 0}.v{background:#9aa4b2}.p{background:var(--warm)}.r{background:var(--hot)}
.leg{font-size:12px;color:var(--sub);margin-top:6px}.leg i{height:9px;margin:0 4px 0 10px;border-radius:2px}
.facts{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--sub)}.facts b{color:var(--ink)}
.sub{margin-top:16px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}.mu{color:var(--mute)}
.hero{display:flex;align-items:baseline;gap:16px;margin:0 0 12px}.hero b{font-size:24px;margin-right:4px}
.in{width:100%;border:1px solid #d5d9de;border-radius:8px;padding:8px 10px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.acc{grid-template-columns:1fr auto;}.acc .dt,.acc .mt{grid-column:1/-1}.acc .ag{grid-row:1;grid-column:2}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
/* STORE LEADS v4 -- company-store data only (Steven, 2026-11-18: "the dashboard is purely company store data ... I want to
   see all time ... think from first principles as a top 1% b2b revenue architect").
   Calls, outcomes and scripts live in Apollo, so nothing here asks Steven to do anything. The page reads store behaviour
   the way a revenue team reads intent data:
     1. WHO IS IN MARKET, AND HOW FAR ALONG?  Every account by buying stage (requested a quote > pricing > evaluating
        > browsing), newest first, with what they priced, how many people, and which email brought them.
     2. WHO PRICED AND WENT QUIET?  Stalled deals are the cheapest revenue there is.
     3. WHAT DOES THE MARKET WANT?  Products priced and opened across every store, and searches we could not answer.
     4. WHICH OUTREACH CREATES BUYERS?  Per email step and newsletter edition: sent -> real visits -> pricing -> requests.
     5. ONE COMPANY, ALL TIME.  Search any company: its whole history in plain English.
   Only real people count: email scanners, bare page loads and our own agents never appear. Default window: all time. */
var API='/kits/_api/events.php';
var KEY='',D=null,STORES=[],Q='',DAYS=+(localStorage.getItem('jdp_dash_days4')||0),ALL=false,LAST_OK=0,TIMER=null,OPEN={};
try{
  var m=/[#&]k=([a-f0-9]{32,})/i.exec(location.hash);
  if(m){localStorage.setItem('jdp_dash_key',m[1]);history.replaceState(null,'',location.pathname);}
  KEY=localStorage.getItem('jdp_dash_key')||'';
  localStorage.setItem('jdp_internal','1');          // this browser is staff: the stores never count it
  var qm=/[?&]q=([^&]+)/.exec(location.search);if(qm)Q=decodeURIComponent(qm[1].replace(/\+/g,' '));
}catch(e){}
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('on');},2200);}
function ago(t){var s=Math.max(0,Math.round(Date.now()/1000-t));if(s<90)return'just now';if(s<3600)return Math.round(s/60)+' min ago';
  if(s<86400)return Math.round(s/3600)+' h ago';var d=Math.round(s/86400);return d+(d===1?' day ago':' days ago');}
function when(t){var d=new Date(t*1000),n=new Date();var same=d.toDateString()===n.toDateString();
  return (same?'Today ':d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+', ')+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
function clock(t){return new Date(t*1000).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
var CATN={jackets:'jackets',tops:'shirts & polos',layers:'layers & fleece',vests:'vests',headwear:'headwear',pants:'pants',hivis:'hi-vis',golf:'golf',bags:'bags',gifts:'gifts',fr:'FR',team:'team uniform',event:'event'};
function catn(c){return CATN[c]||String(c||'').replace(/[-_]/g,' ');}
function pn(r){return r.kn?r.kn.split(' · ')[0]:(r.k?String(r.k).replace(/_/g,' '):'a product');}
/* the one plain-English line per thing a buyer did; null = not worth a line */
function say(r){var e=r.e,c=catn(r.c),q=r.q||'',v=r.v||'';
  switch(e){
  case'engaged':return'Browsed the store';
  case'view':case'exit_show':case'logo_home':case'market_hint':case'filter_open':return null;
  case'sheet':return'Looked at '+pn(r);case'add':return'Added '+pn(r)+' to their quote';
  case'search':return'Searched “'+q+'”';case'search0':return'Searched “'+q+'”, and the store showed nothing';
  case'checkout':return'Opened checkout';case'sent':return'Sent a quote request';
  case'quote_view':return'Opened their quote'+(r.n?' ('+r.n+' item'+(r.n>1?'s':'')+')':'');case'quote_pdf':return'Downloaded the quote PDF';case'quote_share':return'Shared the quote with someone';
  case'quote_qty':case'quote_line_qty':return'Changed quantities';case'quote_sizes':return'Entered sizes';
  case'rfq_open':return'Opened "upload an RFQ"';case'adv_go':case'ca_start':return'Started the '+c+' advisor';
  case'ca_result':return'Got '+c+' recommendations';case'ca_add':return'Added the recommended '+c+' picks to their quote';
  case'ca_add1':return'Added '+pn(r)+' from the advisor';case'program':return'Opened a ready-made program';
  case'program_quote':return'Priced a ready-made program';case'program_share':return'Shared a program';
  case'help_ask':case'faq_ask':case'hero_ask':case'xp_ask':return'Asked us a question';
  case'gift_open':return'Looked at employee gifts';case'gift_quote':return'Started a gift quote';
  case'aisle':return'Browsed '+String(r.k||r.c||'').replace(/-/g,' ');case'xp_add':return'Added '+pn(r);
  case'sheet_quote':return'Started a quote from '+pn(r);case'market':return'Switched to '+String(v).toUpperCase()+' pricing';
  }
  return null;}
var SRCN={'ct:e0':'Store email','ct:e4':'Day-4 follow-up','ct:e10':'Day-10 follow-up','ct:cl':'Call-ladder email','ct:li':'LinkedIn','ct:nl':'Newsletter','ct:nu':'Nurture email','direct':'No tag (typed, bookmarked or forwarded)'};
function srcn(s){if(SRCN[s])return SRCN[s];if(s.indexOf('utm:')===0){var u=s.slice(4);return(/^nl/.test(u)?'Newsletter · ':'Link tag · ')+u;}return s.replace(/^ct:/,'Email step ');}
function telh(p){var n=String(p||'').split(/\(|ext|\bx\s*\d|,|\//i)[0].replace(/[^\d+]/g,'');return n.length>=7?'tel:'+n:'';}
/* ---- data ---- */
function api(qs,body){
  var o=body?{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain'}}:{cache:'no-store'};
  return fetch(API+'?'+qs+'&key='+encodeURIComponent(KEY),o).then(function(r){if(r.status===403)throw new Error('key');return r.json();});
}
function load(){
  if(!KEY){gate();return;}
  api('dash=1&days='+DAYS).then(function(d){D=d;LAST_OK=Date.now();var a=document.activeElement;if(a&&a.id==='q'&&D._painted){paintBody();return;}render();})
  .catch(function(e){if(String(e.message)==='key'){localStorage.removeItem('jdp_dash_key');KEY='';gate('That link has expired.');}});
}
function loadStores(){if(!KEY)return;api('stores=1').then(function(j){STORES=j.stores||[];if(Q)paintBody();if(j.pending_names)setTimeout(loadStores,4000);}).catch(function(){});}
function gate(msg){
  $('app').innerHTML='<div class="gate"><h1>Store Leads</h1><p>'+esc(msg||'This page opens from the private link we email to Steven.')+'</p>'
   +'<button class="btn pri" id="sendlink">Email me the link</button><p style="margin-top:14px;font-size:12.5px;color:#8a929c">It goes only to steven@justdealspromotions.com.</p></div>';
  $('sendlink').onclick=function(){fetch(API+'?send=1').then(function(r){return r.json();}).then(function(j){toast(j.sent?'Sent. Check your inbox.':'Already sent within the hour. Check your inbox.');});};
}


/* ---- helpers ---- */
var STG=['','Browsing','Evaluating','Pricing','Requested a quote'],STC=['','cool','cool','warm','hot'];
/* Same rule as the server's person_ev(): any scroll/tap/click counts, and any store we emailed an alert about is always shown (2026-11-26). */
function isReal(l){return (l.real||0)>0||(l.stage||0)>=2||(l.alerts_n||0)>0;}
var TRN={first_visit:'First visit',return:'Came back',forwarded:'Passed on',quote:'Built a quote',checkout_abandon:'Left checkout',no_stock:'Searched, found nothing',sent:'Sent a request'};
function co(l){return (l.contact&&l.contact.company)||l.client;}
function storeUrl(kit){return'https://justdealspromotions.com/kits/'+encodeURIComponent(kit)+'/?jdpstaff=1';}
function win(){return DAYS?'the last '+DAYS+' days':'all time';}
function pname(n){return String(n||'').split(' · ')[0];}
function kind(n){n=String(n||'').toLowerCase();var K=[[/hoodie|hooded/,'hoodies'],[/quarter|1\/4|half-zip|1\/2/,'quarter-zips'],[/polo/,'polos'],[/vest/,'vests'],[/parka|softshell|jacket|shell|bomber|3-in-1/,'jackets'],
  [/t-shirt|\btee\b/,'t-shirts'],[/crew|sweatshirt|fleece/,'fleece'],[/shirt/,'shirts'],[/toque|beanie/,'toques'],[/cap|hat\b/,'caps'],[/pant|jogger|bib|coverall/,'work pants'],[/backpack|duffel|bag|cooler/,'bags'],[/hard hat/,'hard hats'],[/mug|bottle|tumbler/,'drinkware']];
  for(var i=0;i<K.length;i++)if(K[i][0].test(n))return K[i][1];return'';}
function interests(l){var o=[];(l.products||[]).forEach(function(p){var k=kind(p.name);if(k&&o.indexOf(k)<0)o.push(k);});
  Object.keys(l.advisor||{}).forEach(function(c){var k=catn(c);if(o.indexOf(k)<0)o.push(k);});return o.slice(0,4);}
function quoteTxt(q){if(!q)return'';return q.lines.slice(0,3).map(function(p){return p.qty+' × '+pname(p.name)+(p.colour?' ('+p.colour+')':'');}).join(', ')+(q.lines.length>3?' +'+(q.lines.length-3)+' more':'')+(q.tot?' · about $'+Math.round(q.tot).toLocaleString():'');}
function visits(l){
  var by={},order=[];(l.timeline||[]).forEach(function(r){var k=r.s||'?';if(!by[k]){by[k]={t:r.t,lines:[]};order.push(k);}
    var s=say(r);if(s&&by[k].lines.indexOf(s)<0)by[k].lines.push(s);by[k].t=Math.max(by[k].t,r.t);});
  return order.map(function(k){var v=by[k];if(v.lines.length>1)v.lines=v.lines.filter(function(x){return x!=='Browsed the store';});return v;}).filter(function(v){return v.lines.length;}).sort(function(a,b){return b.t-a.t;});}
function rowHtml(l){
  var st=l.stage||1,q=(l.quotes||[])[0],it=interests(l);
  return'<button class="acc" data-co="'+esc(l.kit)+'"><span class="nm">'+esc(co(l))+'</span>'
   +'<span class="pill '+STC[st]+'">'+STG[st]+'</span>'+(l.live?'<span class="pill live"><span class="dot"></span> now</span>':'')
   +'<span class="dt">'+(q?esc(quoteTxt(q)):it.length?'Looking at '+esc(it.join(', ')):(l.alerts&&l.alerts[0])?'Alert: '+esc(l.alerts[0].detail):'')+'</span>'
   +'<span class="mt">'+(l.devices_n>1?l.devices_n+' people · ':'')+(l.real||0)+' visit'+((l.real||0)===1?'':'s')+(l.sources&&l.sources.length?' · '+esc(srcn(l.sources[0])):'')+'</span>'
   +'<span class="ag">'+ago(l.last)+'</span></button>';}
function bar(v,max,cls){return'<i class="'+cls+'" style="height:'+(max?Math.max(v?3:0,Math.round(60*v/max)):0)+'px" title="'+v+'"></i>';}
/* ---- render ---- */
function render(){
  if(!D){$('app').innerHTML='<div class="gate"><p>Loading…</p></div>';return;}
  $('app').innerHTML='<div class="top"><div class="bar"><div class="brand"><i></i>Store Leads</div>'
   +'<label class="q"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
   +'<input id="q" type="search" placeholder="Search any company…" autocomplete="off" value="'+esc(Q)+'"></label>'
   +'<div class="ctl"><select id="days" aria-label="Time window">'+[[0,'All time'],[90,'Last 90 days'],[30,'Last 30 days'],[7,'Last 7 days']].map(function(o){return'<option value="'+o[0]+'"'+(o[0]===DAYS?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'
   +'<span><span class="dot"></span> '+clock(D.now)+'</span></div></div></div><main id="body"></main>';
  D._painted=1;paintBody();
}
var CO=null,COK='';
function paintBody(){var el=$('body');if(!el)return;var y=window.scrollY;
  el.innerHTML=COK?companyHtml():Q.trim()?searchHtml(Q.trim()):homeHtml();window.scrollTo(0,COK?0:y);}
function homeHtml(){
  var leads=(D.leads||[]).filter(isReal),live=(D.live||[]).filter(function(s){return!s.staff;});
  var by=[0,0,0,0,0];leads.forEach(function(l){by[l.stage||1]++;});
  leads.sort(function(a,b){return (b.live-a.live)||((b.stage||0)-(a.stage||0))||(b.last-a.last);});
  var now=D.now,quiet=leads.filter(function(l){return(l.stage||0)>=3&&now-l.last>14*86400;}).sort(function(a,b){return b.last-a.last;});
  var h='<div class="kpis">'+[[leads.length,'accounts with real buyers'],[by[4],'requested a quote'],[by[3],'pricing'],[by[2],'evaluating'],[live.length,'in a store now']].map(function(k,i){
     return'<div class="kpi'+(i===1?' h':'')+'"><b>'+k[0]+'</b><span>'+k[1]+'</span></div>';}).join('')+'</div><p class="lede">'+esc(win().replace(/^./,function(c){return c.toUpperCase();}))+'. Only people doing things: email scanners, bare page loads and our own visits are left out.</p>';
  if(live.length)h+='<h2>In a store right now</h2>'+live.map(function(s){var last=(s.ev||[]).map(say).filter(Boolean).pop();
     return'<button class="acc" data-co="'+esc(s.kit)+'"><span class="dot"></span><span class="nm">'+esc(s.client)+'</span><span class="dt">'+esc(last||'Browsing')+'</span><span class="ag">'+ago(s.last)+'</span></button>';}).join('');
  var AL=(D.alerts||[]);if(AL.length)h+='<h2>Alerts we sent you · last 7 days</h2><p class="lede">Every store alert that went to your inbox, newest first. Click one for that company.</p><div class="list">'+AL.slice(0,20).map(function(a){
     return'<button class="acc" data-co="'+esc(a.kit)+'"><span class="nm">'+esc(a.client||a.kit)+'</span><span class="pill '+(a.trigger==='sent'||a.trigger==='quote'||a.trigger==='checkout_abandon'?'hot':a.trigger==='forwarded'||a.trigger==='return'?'warm':'cool')+'">'+esc(TRN[a.trigger]||a.trigger)+'</span><span class="dt">'+esc(a.detail)+'</span><span class="ag">'+ago(a.t)+'</span></button>';}).join('')+'</div>';
  h+='<h2>Accounts by buying stage</h2><p class="lede">Furthest along first, then most recent. Click any account for its full history.</p>';
  var show=ALL?leads:leads.slice(0,25);
  h+=show.length?'<div class="list">'+show.map(rowHtml).join('')+'</div>':'<div class="empty">No real buyer activity in this window.</div>';
  if(!ALL&&leads.length>25)h+='<button class="btn" data-all="1">Show all '+leads.length+'</button>';
  if(quiet.length)h+='<h2>Priced, then went quiet</h2><p class="lede">Reached the pricing stage, then no visit for 14 days or more.</p><div class="list">'+quiet.slice(0,15).map(rowHtml).join('')+'</div>';
  h+=demandHtml()+sourcesHtml()+trendHtml()+relayHtml();
  return h;
}
function demandHtml(){
  var P=(D.demand||[]).filter(function(p){return p.priced_by||p.opened;}).slice(0,15),Z=((D.improve||{}).zero||[]).slice(0,12);
  if(!P.length&&!Z.length)return'';
  var h='<h2>What the market wants</h2><p class="lede">Across every store, '+esc(win())+'.</p><div class="two">';
  if(P.length)h+='<table class="src"><tr><th>Product</th><th class="n">Companies pricing it</th><th class="n">Pieces priced</th><th class="n">Opened</th></tr>'
    +P.map(function(p){return'<tr><td>'+esc(pname(p.name))+'</td><td class="n"><b>'+p.priced_by+'</b></td><td class="n">'+(p.priced_qty||0).toLocaleString()+'</td><td class="n">'+p.opened+'</td></tr>';}).join('')+'</table>';
  if(Z.length)h+='<table class="src"><tr><th>Searched for, store showed nothing</th><th class="n">Times</th></tr>'+Z.map(function(z){return'<tr><td>“'+esc(z.q)+'”</td><td class="n">'+z.n+'</td></tr>';}).join('')+'</table>';
  return h+'</div>';
}
function sourcesHtml(){
  var S=D.sources||{},SN=D.sent_by_source||{};Object.keys(SN).forEach(function(k){if(!S[k])S[k]={opens:0,acted:0,pricing:0,requests:0,stores:[],top:[]};});
  var keys=Object.keys(S).filter(function(k){return S[k].opens||SN[k];});if(!keys.length)return'';
  keys.sort(function(a,b){return((S[b].pricing||0)-(S[a].pricing||0))||((S[b].acted||0)-(S[a].acted||0));});
  function per(v,n){return n?(Math.round(1000*v/n)/10)+'':'–';}
  return'<h2>Which outreach creates buyers</h2><p class="lede">Each email step and newsletter edition, '+esc(win())+'. Real visits and pricing are people doing something; "per 100 sent" is the number to compare.</p>'
   +'<table class="src"><tr><th>Came from</th><th class="n">Sent</th><th class="n">Real visits</th><th class="n">Pricing</th><th class="n">Requests</th><th class="n">Real visits per 100 sent</th><th>What they looked at</th></tr>'
   +keys.map(function(k){var v=S[k],n=SN[k];
     return'<tr><td>'+esc(srcn(k))+'</td><td class="n">'+(n!=null?n.toLocaleString():'<span class="mu">–</span>')+'</td><td class="n"><b>'+(v.acted||0)+'</b></td><td class="n">'+(v.pricing||0)+'</td><td class="n">'+(v.requests||0)+'</td>'
       +'<td class="n">'+per(v.acted||0,n)+'</td><td>'+esc((v.top||[]).map(pname).join(', '))+'</td></tr>';}).join('')+'</table>';
}
function trendHtml(){
  var W=D.weeks||{},ks=Object.keys(W).slice(-16);if(ks.length<2)return'';
  var mx=Math.max.apply(null,ks.map(function(k){return W[k].visits;}).concat([1]));
  return'<h2>Week by week</h2><p class="lede">Real visits, visits that reached pricing, and quote requests.</p><div class="trend">'+ks.map(function(k){var w=W[k];
    return'<div class="wk" title="'+esc(k)+': '+w.visits+' real visits at '+w.stores+' companies, '+w.pricing+' pricing, '+w.requests+' requests"><div class="bars">'+bar(w.visits,mx,'v')+bar(w.pricing,mx,'p')+bar(w.requests,mx,'r')+'</div><span>'+esc(k.slice(5))+'</span></div>';}).join('')
   +'</div><div class="leg"><i class="v"></i> real visits <i class="p"></i> pricing <i class="r"></i> requests</div>';
}
function relayHtml(){var R=D.relay;
  return'<details class="more"><summary>Settings · alert webhook '+(R?'<span class="pill live">connected · '+esc(R.host)+'</span>':'<span class="pill hot">not set</span>')+'</summary>'
   +'<div class="card"><p class="lede" style="margin-top:0">Where buying signals are sent so the Outbound Ops Manager can alert you and update Apollo. Paste it once; the secret is stored on the server and never shown again.</p>'
   +'<form id="relayf" style="display:grid;gap:8px;max-width:640px">'
   +'<label>Webhook URL<br><input name="url" type="url" required placeholder="https://…" class="in"></label>'
   +'<div style="display:flex;gap:8px;flex-wrap:wrap"><label style="flex:1;min-width:200px">Secret header name<br><input name="hn" placeholder="e.g. X-Webhook-Secret" class="in"></label>'
   +'<label style="flex:2;min-width:240px">Secret value<br><input name="hv" type="password" autocomplete="off" class="in"></label></div>'
   +'<div class="acts2"><button class="btn pri" type="submit">Save</button>'+(R?'<button class="btn" type="button" data-relayoff="1">Disconnect</button>':'')+'</div></form></div></details>';}
function searchHtml(q){
  var t=q.toLowerCase(),leads=D.leads||[],seen={},hits=[];
  leads.forEach(function(l){var c=l.contact||{},hay=[l.client,l.kit,c.company].join(' ').toLowerCase();if(hay.indexOf(t)>=0){hits.push(l);seen[l.kit]=1;}});
  hits.sort(function(a,b){return((b.stage||0)-(a.stage||0))||(b.last-a.last);});
  var rest=STORES.filter(function(s){return!seen[s.kit]&&(s.client+' '+s.kit).toLowerCase().indexOf(t)>=0;}).slice(0,40),n=hits.length+rest.length;
  var h='<div class="hero"><div><b>'+n+'</b> result'+(n===1?'':'s')+' for “'+esc(q)+'”</div><button class="btn sm" data-clear="1">Clear</button></div><div class="list">'+hits.map(rowHtml).join('')
   +rest.map(function(s){return'<button class="acc" data-co="'+esc(s.kit)+'"><span class="nm">'+esc(s.client)+'</span><span class="dt mu">No real visits '+(DAYS?'in '+esc(win()):'yet')+'</span></button>';}).join('')+'</div>';
  if(!n)h+='<div class="empty">'+(STORES.length?'No company store matches that.':'Loading the store list…')+'</div>';
  return h;
}
/* one company, all time, fetched on its own so the history is complete */
function openCo(kit){COK=kit;CO=null;paintBody();window.scrollTo(0,0);try{history.replaceState(null,'',location.pathname+'?co='+encodeURIComponent(kit));}catch(e){}
  api('dash=1&company='+encodeURIComponent(kit)).then(function(d){if(COK!==kit)return;CO=(d.leads||[])[0]||{kit:kit,none:1};paintBody();});}
function companyHtml(){
  var s=STORES.filter(function(x){return x.kit===COK;})[0],name=s?s.client:COK;
  var h='<button class="btn sm" data-back="1">← All accounts</button>';
  if(!CO)return h+'<div class="empty">Loading the full history…</div>';
  var l=CO;if(l.none)return h+'<article class="card"><div class="ch"><h3>'+esc(name)+'</h3><span class="when"><a class="btn sm" href="'+esc(storeUrl(COK))+'" target="_blank" rel="noopener">Open their store</a></span></div><p class="lede">No real visits yet.</p></article>';
  var st=l.stage||1,V=visits(l),it=interests(l),qs=l.quotes||[],srch=Object.keys(l.searches||{});
  h+='<article class="card co"><div class="ch"><h3>'+esc(co(l)||name)+'</h3><span class="pill '+STC[st]+'">'+STG[st]+'</span>'+(l.live?'<span class="pill live"><span class="dot"></span> In the store now</span>':'')
   +'<span class="when"><a class="btn sm" href="'+esc(storeUrl(l.kit))+'" target="_blank" rel="noopener">Open their store</a></span></div>'
   +'<div class="facts"><span>first seen <b>'+esc(when(l.first))+'</b></span><span>last active <b>'+ago(l.last)+'</b></span><span><b>'+(l.real||0)+'</b> real visits on <b>'+(l.days||1)+'</b> day'+((l.days||1)===1?'':'s')+'</span>'
     +'<span><b>'+(l.devices_n||1)+'</b> '+((l.devices_n||1)===1?'person':'people / devices')+'</span>'+(l.sources&&l.sources.length?'<span>came from <b>'+l.sources.map(srcn).map(esc).join(', ')+'</b></span>':'')+'</div>';
  if((l.alerts||[]).length)h+='<div class="sub">Alerts we sent you</div>'+l.alerts.map(function(a){return'<div class="visit"><b>'+esc(when(a.t))+'</b><div>'+esc(a.detail)+'</div></div>';}).join('');
  if(qs.length)h+='<div class="sub">What they priced</div>'+qs.map(function(q){return'<div class="visit"><b>'+esc(when(q.t))+'</b><div>'+esc(quoteTxt(q))+'</div></div>';}).join('');
  if(it.length)h+='<div class="sub">Interested in</div><div>'+esc(it.join(', '))+'</div>';
  if(srch.length)h+='<div class="sub">Searched for</div><div>'+srch.map(function(x){return'“'+esc(x)+'”'+(l.searches[x]==='search0'?' <span class="mu">(nothing shown)</span>':'');}).join(', ')+'</div>';
  h+='<div class="sub">Every visit</div>'+(V.length?V.map(function(v){return'<div class="visit"><b>'+esc(when(v.t))+'</b>'+v.lines.slice(0,15).map(function(x){return'<div>'+esc(x)+'</div>';}).join('')+'</div>';}).join(''):'<div class="mu">Only page loads so far.</div>');
  return h+'</article>';
}
/* ---- events ---- */
var qT=null;
function setQ(v){Q=v;COK='';var i=$('q');if(i&&i.value!==v)i.value=v;paintBody();try{history.replaceState(null,'',location.pathname+(Q.trim()?'?q='+encodeURIComponent(Q.trim()):''));}catch(e){}}
document.addEventListener('input',function(ev){if(ev.target.id!=='q')return;var v=ev.target.value;clearTimeout(qT);qT=setTimeout(function(){setQ(v);},120);});
document.addEventListener('change',function(ev){if(ev.target.id==='days'){DAYS=+ev.target.value;localStorage.setItem('jdp_dash_days4',DAYS);load();}});
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-co],[data-all],[data-clear],[data-back],[data-relayoff]');if(!t)return;
  if(t.dataset.co){openCo(t.dataset.co);return;}
  if(t.dataset.all){ALL=true;paintBody();return;}
  if(t.dataset.clear||t.dataset.back){setQ(t.dataset.back?Q:'');return;}
  if(t.dataset.relayoff)api('relay=1',{url:''}).then(function(){toast('Disconnected');load();});
});
document.addEventListener('submit',function(ev){if(ev.target.id!=='relayf')return;ev.preventDefault();var f=ev.target,hd={};
  if(f.elements.hn.value.trim())hd[f.elements.hn.value.trim()]=f.elements.hv.value;
  api('relay=1',{url:f.elements.url.value.trim(),headers:hd}).then(function(j){toast(j.ok?'Saved':'That URL was not accepted');load();});});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()-LAST_OK>15000)load();});
try{var cm=/[?&]co=([a-z0-9_\-]+)/.exec(location.search);if(cm)COK=cm[1];}catch(e){}

load();loadStores();TIMER=setInterval(function(){if(!document.hidden&&!COK)load();},45000);
if(COK)openCo(COK);
})();
</script>
</body>
</html>
