<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Store Leads · Just Deals Promotions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101418;--sub:#5b6470;--mute:#8a929c;--line:#e6e8eb;--soft:#f5f6f8;--bg:#fafbfc;--card:#fff;--acc:#d71f2b;--hot:#d71f2b;--hotbg:#fdecee;--warm:#b45309;--warmbg:#fef3e2;--cool:#475569;--coolbg:#eef1f5;--ok:#0f7b4f;--okbg:#e6f5ee;--live:#12a150}
*{box-sizing:border-box}html,body{margin:0}body{font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap}.brand i{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.q{flex:1;min-width:220px;position:relative}.q input{width:100%;border:1px solid #d5d9de;border-radius:10px;padding:10px 14px 10px 38px;font-size:15px;background:#fff}
.q input:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.q svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute)}
.ctl{display:flex;align-items:center;gap:10px;white-space:nowrap;color:var(--sub);font-size:13px}.ctl select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);display:inline-block}
main{max-width:1080px;margin:0 auto;padding:22px 24px 60px}
h2{font-size:17px;margin:28px 0 4px;letter-spacing:-.01em}h2:first-child{margin-top:4px}.lede{color:var(--sub);margin:0 0 12px;font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:500;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}.btn.call{background:var(--ok);border-color:var(--ok);color:#fff}.btn.sm{padding:4px 9px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card.hot{border-left:4px solid var(--hot)}.card.warm{border-left:4px solid var(--warm)}.card.cool{border-left:4px solid var(--line)}.card.quiet{opacity:.6}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ch h3{margin:0;font-size:16px}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px}.pill.hot{background:var(--hotbg);color:var(--hot)}.pill.warm{background:var(--warmbg);color:var(--warm)}.pill.cool{background:var(--coolbg);color:var(--cool)}
.pill.live{background:var(--okbg);color:var(--ok)}.when{margin-left:auto;color:var(--mute);font-size:12.5px;white-space:nowrap}
.who{margin-top:6px;font-size:13.5px}.who b{font-weight:600}.who span{color:var(--sub)}
.did{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:3px;font-size:13.5px}.did li:before{content:'•';color:var(--mute);margin-right:7px}.did li.h{font-weight:600}.did li.h:before{color:var(--hot)}
.priced{margin-top:8px;background:var(--soft);border-radius:8px;padding:8px 10px;font-size:13px}.priced b{font-variant-numeric:tabular-nums}
.from{margin-top:8px;font-size:12.5px;color:var(--sub)}
.acts2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
details.tl{margin-top:10px}details.tl summary{cursor:pointer;color:var(--sub);font-size:13px;font-weight:600}
.visit{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:10px 0 0}.visit b{font-size:12.5px;color:var(--sub);font-weight:600}.visit div{font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);background:#fff;border-radius:10px;margin-bottom:6px}.row .mu{color:var(--mute);font-size:12.5px}.row .sp{flex:1}
table.src{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
table.src th,table.src td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}table.src th{background:var(--soft);font-weight:600;color:var(--sub);font-size:12px}
table.src td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}table.src th.n{text-align:right}table.src tr:last-child td{border-bottom:0}
.lnk{background:none;border:0;padding:0;color:#1a56c4;cursor:pointer;text-decoration:underline;font-size:12.5px}
.empty{padding:22px;text-align:center;color:var(--sub);background:#fff;border:1px dashed var(--line);border-radius:12px}
details.more>summary{cursor:pointer;font-weight:600;font-size:15px;margin:28px 0 10px;list-style:none}details.more>summary:before{content:'▸ ';color:var(--mute)}details.more[open]>summary:before{content:'▾ '}
.gate{max-width:460px;margin:12vh auto;text-align:center;padding:0 20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;opacity:0;transition:.2s;pointer-events:none;font-size:13px}.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:640px){.bar{padding:10px 14px}main{padding:16px 14px}.when{margin-left:0;width:100%}}
/* ACT:BEGIN css — Today's revenue actions (decrypted in the browser from actions.json) */
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 22px;overflow:hidden}
.acth{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#fbfbfc)}
.acth h2{margin:0;font-size:18px;letter-spacing:-.015em}.acth .mu{color:var(--mute);font-size:12.5px}
.acts{display:flex;gap:6px;flex-wrap:wrap}.acts span{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--soft);color:var(--sub)}
.acts span b{font-variant-numeric:tabular-nums;margin-right:4px;color:var(--ink)}
.acts .t-REPLY{background:var(--hotbg);color:var(--hot)}.acts .t-REPLY b{color:var(--hot)}
.acts .t-EMAIL{background:#e8f0fe;color:#1a56c4}.acts .t-EMAIL b{color:#1a56c4}
.acts .t-CALL{background:var(--okbg);color:var(--ok)}.acts .t-CALL b{color:var(--ok)}
.acts .t-VENDOR{background:var(--warmbg);color:var(--warm)}.acts .t-VENDOR b{color:var(--warm)}
.actwarn{margin:12px 18px 0;padding:9px 12px;border-radius:8px;background:var(--hotbg);color:#8a1720;font-size:13px}
.actg{padding:14px 18px 4px}.actg+.actg{border-top:1px dashed var(--line)}
.actg h3{margin:0 0 10px;font-size:14px;display:flex;align-items:baseline;gap:8px}.actg h3 i{font-style:normal;font-weight:500;color:var(--sub);font-size:12.5px}
.actg h3 em{font-style:normal;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ink);color:#fff}
.actl{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;margin-bottom:10px;align-items:start}
.ac{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:#fff;display:flex;flex-direction:column;gap:6px;min-width:0}
.ac.REPLY{border-left:3px solid var(--hot)}.ac.EMAIL{border-left:3px solid #1a56c4}.ac.CALL{border-left:3px solid var(--ok)}.ac.VENDOR{border-left:3px solid var(--warm)}.ac.NOTE{border-left:3px solid var(--cool)}
.ac .co{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}.ac .co span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac .op{margin-left:auto;flex:none;font-size:11.5px;font-weight:700;background:var(--hotbg);color:var(--hot);border-radius:999px;padding:2px 8px}
.ac .op.lo{background:var(--soft);color:var(--sub)}
.ac .who{color:var(--sub);font-size:12.5px}.ac .what{font-size:13.5px;line-height:1.45}
.ac .qt{font-size:12px;color:var(--sub);background:var(--soft);border-radius:6px;padding:6px 8px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}.ac .qt.on{-webkit-line-clamp:unset;display:block}
.ac .oth{font-size:11.5px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}.ac .oth.on{-webkit-line-clamp:unset;display:block}
.ac .due{font-size:12px;color:var(--sub)}.ac .due.late{color:var(--hot);font-weight:600}.ac .due.now{color:var(--ok);font-weight:600}
.ac .lk{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.actmore{margin:0 0 12px}.actmore>summary{cursor:pointer;color:var(--sub);font-size:13px;font-weight:600;padding:6px 0;list-style:none}
.actmore>summary::-webkit-details-marker{display:none}.actmore>summary:before{content:'▸ ';}.actmore[open]>summary:before{content:'▾ ';}
.actstub{color:var(--mute);font-size:12.5px;padding:0 0 12px}
.actfold{border:0;background:none;color:var(--sub);cursor:pointer;font-size:12.5px;margin-left:auto}
@media (max-width:760px){.actl{grid-template-columns:1fr}.acth{padding:14px}.actg{padding:12px 14px 2px}}
/* ACT:END css */

</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
/* STORE LEADS v2 (Steven, 2026-11-18: "extremely hard to use. we need to keep it simple and super effective").
   One screen, no tabs: search any company -> its activity; otherwise who to call, who is in a store now, and which
   emails / newsletters actually bring people in. Only visits where a person DID something count; page loads (email
   scanners) and our own agents' visits never appear. Data: /kits/_api/events.php?dash=1 and ?stores=1. */
var API='/kits/_api/events.php';
var KEY='',D=null,STORES=[],Q='',DAYS=+(localStorage.getItem('jdp_dash_days2')||30),ALL=false,LAST_OK=0,TIMER=null,OPEN={};
try{
  var m=/[#&]k=([a-f0-9]{32,})/i.exec(location.hash);
  if(m){localStorage.setItem('jdp_dash_key',m[1]);history.replaceState(null,'',location.pathname);}
  KEY=localStorage.getItem('jdp_dash_key')||'';
  localStorage.setItem('jdp_internal','1');          // this browser is staff: the stores never count it
  var qm=/[?&]q=([^&]+)/.exec(location.search);if(qm)Q=decodeURIComponent(qm[1].replace(/\+/g,' '));
}catch(e){}
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('on');},2200);}
function ago(t){var s=Math.max(0,Math.round(Date.now()/1000-t));if(s<90)return'just now';if(s<3600)return Math.round(s/60)+' min ago';
  if(s<86400)return Math.round(s/3600)+' h ago';var d=Math.round(s/86400);return d+(d===1?' day ago':' days ago');}
function when(t){var d=new Date(t*1000),n=new Date();var same=d.toDateString()===n.toDateString();
  return (same?'Today ':d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+', ')+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
function clock(t){return new Date(t*1000).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
var CATN={jackets:'jackets',tops:'shirts & polos',layers:'layers & fleece',vests:'vests',headwear:'headwear',pants:'pants',hivis:'hi-vis',golf:'golf',bags:'bags',gifts:'gifts',fr:'FR',team:'team uniform',event:'event'};
function catn(c){return CATN[c]||String(c||'').replace(/[-_]/g,' ');}
function pn(r){return r.kn?r.kn.split(' · ')[0]:(r.k?String(r.k).replace(/_/g,' '):'a product');}
/* the one plain-English line per thing a buyer did; null = not worth a line */
function say(r){var e=r.e,c=catn(r.c),q=r.q||'',v=r.v||'';
  switch(e){
  case'view':case'engaged':case'exit_show':case'logo_home':case'market_hint':case'filter_open':return null;
  case'sheet':return'Looked at '+pn(r);case'add':return'Added '+pn(r)+' to their quote';
  case'search':return'Searched “'+q+'”';case'search0':return'Searched “'+q+'”, and the store showed nothing';
  case'checkout':return'Opened checkout';case'sent':return'Sent a quote request';
  case'quote_view':return'Opened their quote'+(r.n?' ('+r.n+' item'+(r.n>1?'s':'')+')':'');case'quote_pdf':return'Downloaded the quote PDF';case'quote_share':return'Shared the quote with someone';
  case'quote_qty':case'quote_line_qty':return'Changed quantities';case'quote_sizes':return'Entered sizes';
  case'rfq_open':return'Opened "upload an RFQ"';case'adv_go':case'ca_start':return'Started the '+c+' advisor';
  case'ca_result':return'Got '+c+' recommendations';case'ca_add':return'Added the recommended '+c+' picks to their quote';
  case'ca_add1':return'Added '+pn(r)+' from the advisor';case'program':return'Opened a ready-made program';
  case'program_quote':return'Priced a ready-made program';case'program_share':return'Shared a program';
  case'help_ask':case'faq_ask':case'hero_ask':case'xp_ask':return'Asked us a question';
  case'gift_open':return'Looked at employee gifts';case'gift_quote':return'Started a gift quote';
  case'aisle':return'Browsed '+String(r.k||r.c||'').replace(/-/g,' ');case'xp_add':return'Added '+pn(r);
  case'sheet_quote':return'Started a quote from '+pn(r);case'market':return'Switched to '+String(v).toUpperCase()+' pricing';
  }
  return null;}
var SRCN={'ct:e0':'Store email','ct:e4':'Day-4 follow-up','ct:e10':'Day-10 follow-up','ct:cl':'Call-ladder email','ct:li':'LinkedIn','ct:nl':'Newsletter','ct:nu':'Nurture email','direct':'No tag (typed, bookmarked or forwarded)'};
function srcn(s){if(SRCN[s])return SRCN[s];if(s.indexOf('utm:')===0){var u=s.slice(4);return(/^nl/.test(u)?'Newsletter · ':'Link tag · ')+u;}return s.replace(/^ct:/,'Email step ');}
function telh(p){var n=String(p||'').split(/ext|\bx\s*\d|,|\//i)[0].replace(/[^\d+]/g,'');return n.length>=7?'tel:'+n:'';}
/* ---- data ---- */
function api(qs,body){
  var o=body?{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain'}}:{cache:'no-store'};
  return fetch(API+'?'+qs+'&key='+encodeURIComponent(KEY),o).then(function(r){if(r.status===403)throw new Error('key');return r.json();});
}
function load(){
  if(!KEY){gate();return;}
  actLoad();
  api('dash=1&days='+DAYS).then(function(d){D=d;LAST_OK=Date.now();var a=document.activeElement;if(a&&a.id==='q'&&D._painted){paintBody();return;}render();})
  .catch(function(e){if(String(e.message)==='key'){localStorage.removeItem('jdp_dash_key');KEY='';gate('That link has expired.');}});
}
function loadStores(){if(!KEY)return;api('stores=1').then(function(j){STORES=j.stores||[];if(Q)paintBody();if(j.pending_names)setTimeout(loadStores,4000);}).catch(function(){});}
function gate(msg){
  $('app').innerHTML='<div class="gate"><h1>Store Leads</h1><p>'+esc(msg||'This page opens from the private link we email to Steven.')+'</p>'
   +'<button class="btn pri" id="sendlink">Email me the link</button><p style="margin-top:14px;font-size:12.5px;color:#8a929c">It goes only to steven@justdealspromotions.com.</p></div>';
  $('sendlink').onclick=function(){fetch(API+'?send=1').then(function(r){return r.json();}).then(function(j){toast(j.sent?'Sent. Check your inbox.':'Already sent within the hour. Check your inbox.');});};
}
/* ---- helpers on a lead ---- */
function isReal(l){return (l.real||0)>0||(l.priced&&l.priced.length)||(l.signals||[]).some(function(s){return s[0]==='h';});}
function person(l){
  var c=l.contact||{},p=(l.people||[]).filter(function(x){return x.name;}).sort(function(a,b){return b.last-a.last;})[0];
  var n=p?p.name:c.name,t=p?p.title:c.title,ph=(p&&p.phone)||c.phone,em=(p&&p.email)||c.email;
  return {name:n||'',title:t||'',phone:ph||'',email:em||''};}
function storeUrl(kit){return'https://justdealspromotions.com/kits/'+encodeURIComponent(kit)+'/?jdpstaff=1';}
function visits(l){                                   // the timeline grouped by visit, newest first, plain English only
  var by={},order=[];(l.timeline||[]).forEach(function(r){var k=r.s||'?';if(!by[k]){by[k]={t:r.t,lines:[]};order.push(k);}
    var s=say(r);if(s&&by[k].lines.indexOf(s)<0)by[k].lines.push(s);by[k].t=Math.max(by[k].t,r.t);});
  return order.map(function(k){return by[k];}).filter(function(v){return v.lines.length;}).sort(function(a,b){return b.t-a.t;});}
function cardHtml(l){
  var who=person(l),tel=telh(who.phone),sig=(l.signals||[]);
  var h='<article class="card '+(l.quiet?'quiet ':'')+l.tier+'" data-kit="'+esc(l.kit)+'"><div class="ch"><h3>'+esc((l.contact&&l.contact.company)||l.client)+'</h3>'
   +'<span class="pill '+l.tier+'">'+({hot:'Call today',warm:'Follow up',cool:'Browsing'}[l.tier])+'</span>'
   +(l.live?'<span class="pill live"><span class="dot"></span> In the store now</span>':'')
   +(l.mark&&l.mark.s==='called'&&l.quiet?'<span class="pill cool">Called '+ago(l.mark.t)+'</span>':'')
   +'<span class="when">Last active '+ago(l.last)+'</span></div>';
  if(who.name||who.phone)h+='<div class="who">'+(who.name?'<b>'+esc(who.name)+'</b>':'')+(who.title?' <span>· '+esc(who.title)+'</span>':'')+(who.phone?' <span>· '+esc(who.phone)+'</span>':'')+'</div>';
  var top=sig.filter(function(s){return s[0]==='h';}).concat(sig.filter(function(s){return s[0]!=='h';})).filter(function(s){return!/^Priced /.test(s[1]);}).slice(0,4);
  if(top.length)h+='<ul class="did">'+top.map(function(s){return'<li class="'+s[0]+'">'+esc(s[1])+'</li>';}).join('')+'</ul>';
  if(l.priced&&l.priced.length)h+='<div class="priced">Priced: '+l.priced.map(function(p){return'<b>'+p.qty+'</b> × '+esc(String(p.name).split(' · ')[0])+(p.colour?' ('+esc(p.colour)+')':'');}).join(', ')
    +(l.priced_total?' · about <b>$'+Math.round(l.priced_total).toLocaleString()+'</b>':'')+'</div>';
  if(l.sources&&l.sources.length)h+='<div class="from">Came in from: '+l.sources.map(function(s){return esc(srcn(s));}).join(', ')+'</div>';
  h+='<div class="acts2">'+(tel?'<a class="btn call sm" href="'+esc(tel)+'">Call '+esc(who.phone)+'</a>':'')
   +(who.email?'<a class="btn sm" href="mailto:'+esc(who.email)+'">Email</a>':'')
   +'<a class="btn sm" href="'+esc(storeUrl(l.kit))+'" target="_blank" rel="noopener">Open their store</a>'
   +(l.quiet?'<button class="btn sm" data-mark="clear">Put back on the list</button>':'<button class="btn sm" data-mark="called">I called them</button><button class="btn sm" data-mark="snooze">Not now</button>')+'</div>';
  var V=visits(l);
  if(V.length)h+='<details class="tl" data-tl="'+esc(l.kit)+'"'+(OPEN[l.kit]?' open':'')+'><summary>What they did, visit by visit ('+V.length+')</summary>'
    +V.slice(0,12).map(function(v){return'<div class="visit"><b>'+esc(when(v.t))+'</b>'+v.lines.slice(0,10).map(function(x){return'<div>'+esc(x)+'</div>';}).join('')+'</div>';}).join('')+'</details>';
  return h+'</article>';
}
/* ---- render ---- */
function render(){
  if(!D){$('app').innerHTML='<div class="gate"><p>Loading…</p></div>';return;}
  var h='<div class="top"><div class="bar"><div class="brand"><i></i>Store Leads</div>'
   +'<label class="q"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
   +'<input id="q" type="search" placeholder="Search any company or person…" autocomplete="off" value="'+esc(Q)+'"></label>'
   +'<div class="ctl"><select id="days" aria-label="Time window">'+[[7,'Last 7 days'],[30,'Last 30 days'],[90,'Last 90 days']].map(function(o){return'<option value="'+o[0]+'"'+(o[0]===DAYS?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'
   +'<span><span class="dot"></span> '+clock(D.now)+'</span></div></div></div><main id="body"></main>';
  $('app').innerHTML=h;D._painted=1;paintBody();
}
function paintBody(){
  var el=$('body');if(!el)return;var y=window.scrollY;el.innerHTML=Q.trim()?searchHtml(Q.trim()):homeHtml();window.scrollTo(0,y);
}
function homeHtml(){
  var leads=D.leads||[],real=leads.filter(function(l){return isReal(l)&&!l.quiet;}),quiet=leads.filter(function(l){return l.quiet&&isReal(l);});
  real.sort(function(a,b){var r={hot:0,warm:1,cool:2};return (b.live-a.live)||(r[a.tier]-r[b.tier])||(b.score-a.score);});
  var live=(D.live||[]).filter(function(s){return!s.staff;});
  var h='';
  if(live.length)h+='<h2>In a store right now</h2><p class="lede">Real visitors in the last 15 minutes.</p>'+live.map(function(s){var l=leads.filter(function(x){return x.kit===s.kit;})[0];
     var last=(s.ev||[]).map(say).filter(Boolean).pop();
     return'<div class="row"><span class="dot"></span><b>'+esc(s.client)+'</b><span class="mu">'+esc(last||'browsing')+' · '+ago(s.last)+'</span><span class="sp"></span>'
       +'<button class="lnk" data-find="'+esc(s.client)+'">Activity</button></div>';}).join('');
  h+='<h2>Call these first</h2><p class="lede">Companies where a real person did something in their store in the last '+DAYS+' days, best first. Email scanners, plain page loads and our own visits are left out.</p>';
  var show=ALL?real:real.slice(0,12);
  h+=show.length?show.map(cardHtml).join(''):'<div class="empty">Nobody has done anything in a store in this window yet.</div>';
  if(!ALL&&real.length>12)h+='<button class="btn" data-all="1">Show all '+real.length+'</button>';
  if(quiet.length)h+='<details class="more"><summary>Called or "not now" ('+quiet.length+')</summary>'+quiet.map(cardHtml).join('')+'</details>';
  h+=sourcesHtml();
  h+='<details class="more" id="actwrap"'+(localStorage.getItem('jdp_dash2_act')==='1'?' open':'')+'><summary>Today’s revenue actions</summary>'+actionsHtml()+'</details>';
  return h;
}
function sourcesHtml(){
  var S=D.sources||{},keys=Object.keys(S).filter(function(k){return S[k].opens;});
  if(!keys.length)return'';
  keys.sort(function(a,b){return(S[b].acted-S[a].acted)||(S[b].opens-S[a].opens);});
  var nm={};(D.leads||[]).forEach(function(l){nm[l.kit]=(l.contact&&l.contact.company)||l.client;});STORES.forEach(function(s){if(!nm[s.kit])nm[s.kit]=s.client;});
  return'<h2>Which emails bring people in</h2><p class="lede">Every visit in the last '+DAYS+' days, by the link it came from. Link opens are every click, minus obvious email-scanner bursts. Real visits and quote actions are people doing something.</p>'
   +'<table class="src"><tr><th>Came from</th><th class="n">Link opens</th><th class="n">Real visits</th><th class="n">Quote actions</th><th>Companies that did something</th></tr>'
   +keys.map(function(k){var v=S[k],st=v.stores||[];
     return'<tr><td>'+esc(srcn(k))+'</td><td class="n">'+v.opens+'</td><td class="n"><b>'+(v.acted||0)+'</b></td><td class="n">'+(v.quotes||0)+'</td><td>'
       +(st.length?st.slice(0,8).map(function(s){return'<button class="lnk" data-find="'+esc(nm[s]||s)+'">'+esc(nm[s]||s)+'</button>';}).join(', ')+(st.length>8?' +'+(st.length-8)+' more':''):'<span style="color:#8a929c">none yet</span>')+'</td></tr>';}).join('')
   +'</table>';
}
function searchHtml(q){
  var t=q.toLowerCase(),leads=D.leads||[],seen={},out=[];
  leads.forEach(function(l){var c=l.contact||{},hay=[l.client,l.kit,c.company,c.name].concat((l.people||[]).map(function(p){return p.name;})).join(' ').toLowerCase();
    if(hay.indexOf(t)>=0){out.push(cardHtml(l));seen[l.kit]=1;}});
  var rest=STORES.filter(function(s){return!seen[s.kit]&&(s.client+' '+s.kit).toLowerCase().indexOf(t)>=0;}).slice(0,40);
  var h='<h2>'+(out.length+rest.length)+' result'+(out.length+rest.length===1?'':'s')+' for “'+esc(q)+'”</h2><p class="lede">Activity covers the last '+DAYS+' days. Change the window at the top to look further back.</p>'+out.join('');
  if(rest.length)h+=rest.map(function(s){return'<div class="row"><b>'+esc(s.client)+'</b><span class="mu">No real visits in the last '+DAYS+' days</span><span class="sp"></span><a class="btn sm" href="'+esc(storeUrl(s.kit))+'" target="_blank" rel="noopener">Open their store</a></div>';}).join('');
  if(!out.length&&!rest.length)h+='<div class="empty">'+(STORES.length?'No company store matches that.':'Loading the store list…')+'</div>';
  return h;
}

/* ACT:BEGIN js — "Today's revenue actions". Data: actions.json (encrypted) beside this page, refreshed by
   tools/dash/refresh_actions.py from Airtable ACCOUNTS_V2 "Dash Actions". It is encrypted to this
   dashboard: the private key is derived here from KEY (the events.php key carried by Steven's link),
   so the public file is useless to anyone without the link. */
var ACT=null,ACT_ERR='',ACT_AT=0,ACT_BUSY=false,ACT_MORE={},ACT_FOLD=localStorage.getItem('jdp_dash_act_fold')==='1';
var ACT_PUB={x:'tX2z6qLrFdKTC6UxpydMWGUNk1eXnzRTpQz-VLQ76FY',y:'-hePCz-JpfULvFqV4YEKmB_wp083zT1mNHDFjtcsrM0'};
var ACT_G=[['REPLY','Reply','a buyer wrote back — answer today'],['EMAIL','Email','we need an address to send a built store'],
  ['CALL','Call','due call-backs, highest score first'],['VENDOR','Vendor','register on a procurement portal'],['NOTE','Your notes','from your own calls']];
function ub64(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function b64u(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function actDecrypt(env){
  var S=crypto.subtle,te=new TextEncoder(),EC={name:'ECDH',namedCurve:'P-256'},priv;
  return S.digest('SHA-256',te.encode('jdp-dash-actions-p256:'+KEY)).then(function(d){
    return S.importKey('jwk',{kty:'EC',crv:'P-256',x:ACT_PUB.x,y:ACT_PUB.y,d:b64u(new Uint8Array(d)),ext:true},EC,false,['deriveBits']);
  }).then(function(k){priv=k;return S.importKey('jwk',{kty:'EC',crv:'P-256',x:env.epk.x,y:env.epk.y,ext:true},EC,false,[]);
  }).then(function(epk){return S.deriveBits({name:'ECDH',public:epk},priv,256);
  }).then(function(sh){var a=new Uint8Array(sh),info=te.encode('jdp-dash-actions-v1'),m=new Uint8Array(a.length+info.length);m.set(a);m.set(info,a.length);return S.digest('SHA-256',m);
  }).then(function(k){return S.importKey('raw',k,'AES-GCM',false,['decrypt']);
  }).then(function(k){return S.decrypt({name:'AES-GCM',iv:ub64(env.iv)},k,ub64(env.ct));
  }).then(function(pt){return JSON.parse(new TextDecoder().decode(pt));});
}
function actLoad(force){
  if(!KEY||ACT_BUSY||(!force&&ACT&&Date.now()-ACT_AT<120000))return;
  if(!(window.crypto&&crypto.subtle)){ACT_ERR='This browser cannot unlock the actions (no WebCrypto).';return;}
  ACT_BUSY=true;
  fetch('actions.json?c='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
  .then(actDecrypt).then(function(a){ACT=a;ACT_ERR='';ACT_AT=Date.now();})
  .catch(function(e){ACT_ERR=/http 404/.test(String(e))?'No actions published yet.':'Could not unlock the actions — reopen the dashboard from your latest emailed link.';ACT_AT=Date.now();})
  .then(function(){ACT_BUSY=false;var a=document.activeElement;if(D&&!(a&&a.closest&&a.closest('.edit')))render();});
}
function telh(p){var n=String(p||'').split(/ext|\bx\s*\d|,|\//i)[0].replace(/[^\d+]/g,'');return n.length>=7?'tel:'+n:'';}
function dueTxt(s){if(!s)return'';var d=new Date(s+'T12:00:00'),n=new Date();n.setHours(12,0,0,0);var k=Math.round((d-n)/86400000);
  var lab=d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  if(k<0)return'<div class="due late">Due '+esc(lab)+' · '+(-k)+(k===-1?' day':' days')+' overdue</div>';
  if(k===0)return'<div class="due now">Due today</div>';return'<div class="due">Due '+esc(lab)+(k===1?' · tomorrow':' · in '+k+' days')+'</div>';}
function acard(a){
  var tel=telh(a.phone),L=[];
  if(tel)L.push('<a class="btn sm call" href="'+esc(tel)+'">Call '+esc(a.phone)+'</a>');else if(a.phone)L.push('<span class="btn sm">'+esc(a.phone)+'</span>');
  if(a.email)L.push('<a class="btn sm'+(a.type==='REPLY'?' pri':'')+'" href="mailto:'+esc(a.email)+'">Email</a>');
  if(a.store)L.push('<a class="btn sm" href="'+esc(a.store)+'" target="_blank" rel="noopener">Store</a>');
  if(a.linkedin)L.push('<a class="btn sm" href="'+esc(a.linkedin)+'" target="_blank" rel="noopener">LinkedIn</a>');
  if(a.airtable)L.push('<a class="btn sm" href="'+esc(a.airtable)+'" target="_blank" rel="noopener">Airtable</a>');
  var op=a.opens?'<span class="op'+(a.opens<2?' lo':'')+'" title="Store opens">'+a.opens+(a.opens===1?' open':' opens')+'</span>':'';
  var who=[a.contact,a.title].filter(Boolean).join(' · ');
  return'<div class="ac '+esc(a.type)+'"><div class="co"><span>'+esc(a.company||'—')+'</span>'+op+'</div>'
   +(who?'<div class="who">'+esc(who)+(a.email&&a.type!=='EMAIL'?' · '+esc(a.email):'')+'</div>':'')
   +'<div class="what">'+esc(a.action||'')+'</div>'
   +(a.quote?'<div class="qt">'+esc(String(a.quote).trim())+'</div>':'')
   +dueTxt(a.due)
   +(a.others?'<div class="oth">Also there: '+esc(a.others)+'</div>':'')
   +(L.length?'<div class="lk">'+L.join('')+'</div>':'')+'</div>';}
function actionsHtml(){
  if(!ACT){return'<section class="act"><div class="acth"><h2>Today’s revenue actions</h2><span class="mu">'+esc(ACT_ERR||'Unlocking…')+'</span></div></section>';}
  var S=ACT.summary||{},all=ACT.actions||[],todayN=all.filter(function(a){return a.today;}).length;
  var h='<section class="act"><div class="acth"><h2>Today’s revenue actions</h2><div class="acts">'
   +ACT_G.map(function(g){return'<span class="t-'+g[0]+'"><b>'+(S[g[0]]!=null?S[g[0]]:0)+'</b>'+g[1]+'</span>';}).join('')+'</div>'
   +'<span class="mu">'+todayN+' for today · generated '+esc(ACT.generated_at?when(Date.parse(ACT.generated_at)/1000):'—')+'</span>'
   +'<button class="actfold" data-actfold="1">'+(ACT_FOLD?'Show':'Hide')+'</button></div>';
  if(ACT.truncated)h+='<div class="actwarn"><b>Feed truncated:</b> showing '+(ACT.count||all.length)+' of '+(ACT.expected||'?')+' actions. The Airtable field hit its 100,000-character limit, so the rest (including any vendor registrations and notes) did not come through. The pipeline fix is in progress.</div>';
  if(ACT_FOLD)return h+'</section>';
  ACT_G.forEach(function(g){
    var it=all.filter(function(a){return a.type===g[0];});
    if(g[0]==='CALL')it.sort(function(a,b){return(b.score||0)-(a.score||0);});
    var exp=+(S[g[0]]||0);
    if(!it.length&&!exp)return;
    var now=it.filter(function(a){return a.today;}),later=it.filter(function(a){return!a.today;});
    h+='<div class="actg"><h3>'+g[1]+' <em>'+now.length+' today</em><i>'+g[2]+'</i></h3>';
    if(now.length)h+='<div class="actl">'+now.map(acard).join('')+'</div>';
    else if(it.length)h+='<div class="actstub">Nothing due today.</div>';
    if(later.length)h+='<details class="actmore" data-actmore="'+g[0]+'"'+(ACT_MORE[g[0]]?' open':'')+'><summary>Later this week · '+later.length+'</summary><div class="actl">'+later.map(acard).join('')+'</div></details>';
    if(exp>it.length)h+='<div class="actstub">'+(exp-it.length)+' more not shown (feed truncated).</div>';
    h+='</div>';
  });
  return h+'</section>';
}
document.addEventListener('toggle',function(ev){var d=ev.target;if(d.dataset&&d.dataset.actmore)ACT_MORE[d.dataset.actmore]=d.open;},true);
document.addEventListener('click',function(ev){var q=ev.target.closest('.ac .qt,.ac .oth');if(q){q.classList.toggle('on');return;}var t=ev.target.closest('[data-actfold]');if(!t)return;ACT_FOLD=!ACT_FOLD;localStorage.setItem('jdp_dash_act_fold',ACT_FOLD?'1':'0');render();});
/* ACT:END js */

load();loadStores();TIMER=setInterval(function(){if(!document.hidden)load();},30000);
})();
