<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Store Leads · Just Deals Promotions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#101418;--sub:#5b6470;--mute:#8a929c;--line:#e6e8eb;--soft:#f5f6f8;--bg:#fafbfc;--card:#fff;--acc:#d71f2b;--hot:#d71f2b;--hotbg:#fdecee;--warm:#b45309;--warmbg:#fef3e2;--cool:#475569;--coolbg:#eef1f5;--ok:#0f7b4f;--okbg:#e6f5ee;--live:#12a150;--r:10px}
*{box-sizing:border-box}html,body{margin:0}body{font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:15px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--acc);display:inline-block}
.brand small{font-weight:500;color:var(--mute);font-size:13px}
.tabs{display:flex;gap:2px;margin-left:18px}
.tab{border:0;background:none;padding:8px 12px;border-radius:7px;color:var(--sub);font-weight:500;cursor:pointer}
.tab:hover{background:var(--soft);color:var(--ink)}.tab[aria-selected=true]{background:var(--ink);color:#fff}
.tab b{font-weight:600;margin-left:6px;font-size:12px;opacity:.75}
.sp{flex:1}
.ctl{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px}
.ctl select{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 8px}
.pulse{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sub);white-space:nowrap}
.pulse i{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(18,161,80,.5);animation:pl 2s infinite}
.pulse.off i{background:var(--mute);animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(18,161,80,.45)}70%{box-shadow:0 0 0 7px rgba(18,161,80,0)}100%{box-shadow:0 0 0 0 rgba(18,161,80,0)}}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;cursor:pointer;font-weight:500;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#cfd3d8;background:var(--soft)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}.btn.pri:hover{background:#262c33}
.btn.call{background:var(--live);border-color:var(--live);color:#fff}.btn.call:hover{background:#0e8b44}
.btn.sm{padding:4px 9px;font-size:12.5px}
main{max-width:1280px;margin:0 auto;padding:22px 28px 60px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi span{display:block;color:var(--sub);font-size:12.5px;font-weight:500}
.kpi b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;color:var(--mute);font-size:12px}
.kpi.l b{color:var(--live)}.kpi.h b{color:var(--hot)}
.sect{display:none}.sect.on{display:block}
.h2{display:flex;align-items:baseline;gap:12px;margin:4px 0 12px}.h2 h2{font-size:17px;margin:0;letter-spacing:-.01em}.h2 p{margin:0;color:var(--sub);font-size:13px}
.filters{display:flex;gap:6px;margin-left:auto}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--sub)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.leads{display:grid;gap:12px}
.lead{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 290px;gap:0;overflow:hidden}
.lead.quiet{opacity:.62}
.lead>div{padding:16px 18px}.lead>div+div{border-left:1px solid var(--line)}
.lh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.lh h3{font-size:16px;margin:0;letter-spacing:-.01em}
.tier{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:5px}
.tier.hot{background:var(--hotbg);color:var(--hot)}.tier.warm{background:var(--warmbg);color:var(--warm)}.tier.cool{background:var(--coolbg);color:var(--cool)}
.livepill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--live);text-transform:uppercase;letter-spacing:.04em}
.livepill i{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pl 2s infinite}
.meta{color:var(--mute);font-size:12.5px;margin-top:3px}
.score{display:flex;align-items:center;gap:8px;margin:10px 0 8px}
.score .tr{flex:1;height:5px;background:var(--soft);border-radius:3px;overflow:hidden}.score .tr i{display:block;height:100%;background:var(--ink);border-radius:3px}
.score b{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--sub);min-width:34px;text-align:right}
ul.sig{list-style:none;margin:0;padding:0;display:grid;gap:5px}
ul.sig li{display:flex;gap:8px;align-items:flex-start;font-size:13.3px}
ul.sig li:before{content:"";flex:none;width:6px;height:6px;border-radius:50%;margin-top:7px;background:var(--mute)}
ul.sig li.h:before{background:var(--hot)}ul.sig li.w:before{background:var(--warm)}
.lbl{font-size:11.5px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}
.pchips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.pchip{background:var(--soft);border-radius:6px;padding:3px 8px;font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip.q{background:#fff;border:1px dashed #cfd3d8}.pchip.q0{border-color:var(--hot);color:var(--hot)}
.ct{display:grid;gap:3px;font-size:13.3px}
.ct .nm{font-weight:600}.ct .mu{color:var(--sub)}
.ct a{text-decoration:none}.ct a:hover{text-decoration:underline}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.nocontact{color:var(--mute);font-size:13px}
.mark{margin-top:9px;font-size:12px;color:var(--sub);background:var(--soft);border-radius:6px;padding:5px 8px}
details.tl{grid-column:1/-1;border-top:1px solid var(--line);padding:0 18px}
details.tl summary{cursor:pointer;color:var(--sub);font-size:12.5px;font-weight:500;padding:9px 0;list-style:none}
details.tl summary::-webkit-details-marker{display:none}details.tl summary:before{content:"▸ ";}details.tl[open] summary:before{content:"▾ "}
.tlrows{display:grid;grid-template-columns:110px 54px 1fr;gap:3px 12px;font-size:12.8px;padding:0 0 14px}
.tlrows .t{color:var(--mute);font-variant-numeric:tabular-nums}.tlrows .s{color:var(--mute);font-family:'JetBrains Mono',monospace;font-size:11px}
.edit{display:none;grid-column:1/-1;border-top:1px solid var(--line);padding:14px 18px;background:var(--soft)}
.edit.on{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px;align-items:end}
.edit label{font-size:12px;color:var(--sub);display:grid;gap:3px}
.edit input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.livelist{display:grid;gap:8px}
.lv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:grid;grid-template-columns:220px 1fr auto;gap:16px;align-items:start}
.lv.staff{opacity:.55}
.lv h4{margin:0;font-size:14.5px}.lv .meta{margin:2px 0 0}
.lv ol{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:13px}
.lv ol li span{color:var(--mute);font-variant-numeric:tabular-nums;margin-right:8px;font-size:12px}
.staffb{font-size:10.5px;font-weight:700;background:var(--coolbg);color:var(--cool);border-radius:4px;padding:1px 6px;margin-left:6px;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:13.2px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #f0f1f3;vertical-align:top}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.fun{display:grid;gap:7px}
.fr{display:grid;grid-template-columns:150px 1fr 54px 44px;gap:10px;align-items:center;font-size:13px}
.fr .b{height:20px;background:var(--soft);border-radius:4px;overflow:hidden}.fr .b i{display:block;height:100%;background:var(--ink)}
.fr .n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}.fr .p{text-align:right;color:var(--mute);font-size:12px}
.fix{display:grid;gap:8px;margin-bottom:14px}
.fixi{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:11px 14px;font-size:13.5px}
.fixi b{font-weight:600}.fixi small{display:block;color:var(--sub);margin-top:2px;font-size:12.5px}
.days{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:6px}
.days i{flex:1;background:var(--ink);border-radius:2px 2px 0 0;min-height:2px;position:relative}
.days i.e{background:#9aa3ad}
.empty{color:var(--mute);padding:26px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.gate{max-width:440px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;text-align:center}
.gate h1{font-size:20px;margin:0 0 6px}.gate p{color:var(--sub);margin:0 0 18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.mu{color:var(--sub)}.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
@media (max-width:1100px){.lead{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.lead>div:nth-child(3){grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){.bar{flex-wrap:wrap;padding:10px 16px}.tabs{margin-left:0;order:3;width:100%;overflow:auto}main{padding:16px}.lead{grid-template-columns:1fr}.lead>div+div{border-left:0;border-top:1px solid var(--line)}.grid2{grid-template-columns:1fr}.lv{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.edit.on{grid-template-columns:1fr 1fr}.fr{grid-template-columns:110px 1fr 44px 40px}}

/* ACT:BEGIN css — Today's revenue actions (decrypted in the browser from actions.enc.json) */
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 22px;overflow:hidden}
.acth{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#fbfbfc)}
.acth h2{margin:0;font-size:18px;letter-spacing:-.015em}.acth .mu{color:var(--mute);font-size:12.5px}
.acts{display:flex;gap:6px;flex-wrap:wrap}.acts span{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--soft);color:var(--sub)}
.acts span b{font-variant-numeric:tabular-nums;margin-right:4px;color:var(--ink)}
.acts .t-REPLY{background:var(--hotbg);color:var(--hot)}.acts .t-REPLY b{color:var(--hot)}
.acts .t-EMAIL{background:#e8f0fe;color:#1a56c4}.acts .t-EMAIL b{color:#1a56c4}
.acts .t-CALL{background:var(--okbg);color:var(--ok)}.acts .t-CALL b{color:var(--ok)}
.acts .t-VENDOR{background:var(--warmbg);color:var(--warm)}.acts .t-VENDOR b{color:var(--warm)}
.actwarn{margin:12px 18px 0;padding:9px 12px;border-radius:8px;background:var(--hotbg);color:#8a1720;font-size:13px}
.actg{padding:14px 18px 4px}.actg+.actg{border-top:1px dashed var(--line)}
.actg h3{margin:0 0 10px;font-size:14px;display:flex;align-items:baseline;gap:8px}.actg h3 i{font-style:normal;font-weight:500;color:var(--sub);font-size:12.5px}
.actg h3 em{font-style:normal;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ink);color:#fff}
.actl{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;margin-bottom:10px}
.ac{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:#fff;display:flex;flex-direction:column;gap:6px;min-width:0}
.ac.REPLY{border-left:3px solid var(--hot)}.ac.EMAIL{border-left:3px solid #1a56c4}.ac.CALL{border-left:3px solid var(--ok)}.ac.VENDOR{border-left:3px solid var(--warm)}.ac.NOTE{border-left:3px solid var(--cool)}
.ac .co{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}.ac .co span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac .op{margin-left:auto;flex:none;font-size:11.5px;font-weight:700;background:var(--hotbg);color:var(--hot);border-radius:999px;padding:2px 8px}
.ac .op.lo{background:var(--soft);color:var(--sub)}
.ac .who{color:var(--sub);font-size:12.5px}.ac .what{font-size:13.5px;line-height:1.45}
.ac .qt{font-size:12px;color:var(--sub);background:var(--soft);border-radius:6px;padding:6px 8px;white-space:pre-line}
.ac .oth{font-size:11.5px;color:var(--mute)}
.ac .due{font-size:12px;color:var(--sub)}.ac .due.late{color:var(--hot);font-weight:600}.ac .due.now{color:var(--ok);font-weight:600}
.ac .lk{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.actmore{margin:0 0 12px}.actmore>summary{cursor:pointer;color:var(--sub);font-size:13px;font-weight:600;padding:6px 0;list-style:none}
.actmore>summary::-webkit-details-marker{display:none}.actmore>summary:before{content:'▸ ';}.actmore[open]>summary:before{content:'▾ ';}
.actstub{color:var(--mute);font-size:12.5px;padding:0 0 12px}
.actfold{border:0;background:none;color:var(--sub);cursor:pointer;font-size:12.5px;margin-left:auto}
@media (max-width:760px){.actl{grid-template-columns:1fr}.acth{padding:14px}.actg{padding:12px 14px 2px}}
/* ACT:END css */
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var API='/kits/_api/events.php';
var KEY='',D=null,DAYS=+(localStorage.getItem('jdp_dash_days')||14),TAB=localStorage.getItem('jdp_dash_tab')||'leads',
    SHOW_STAFF=false,TIER='all',OPEN={},EDIT={},LAST_OK=0,TIMER=null,SEEN_LIVE={},NOTIFY=false,FIRST=true;
/* ---- key: from the emailed link (#k=...), kept on this device, never left in the address bar ---- */
try{
  var m=/[#&]k=([a-f0-9]{32,})/i.exec(location.hash);
  if(m){localStorage.setItem('jdp_dash_key',m[1]);history.replaceState(null,'',location.pathname);}
  KEY=localStorage.getItem('jdp_dash_key')||'';
  localStorage.setItem('jdp_internal','1');          // this browser is staff: the stores stop counting it as a lead
  NOTIFY=localStorage.getItem('jdp_dash_notify')==='1'&&'Notification' in window&&Notification.permission==='granted';
}catch(e){}
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('on');},2200);}
function ago(t){var s=Math.max(0,Math.round(Date.now()/1000-t));if(s<60)return'just now';if(s<3600)return Math.round(s/60)+' min ago';
  if(s<86400)return Math.round(s/3600)+' h ago';var d=Math.round(s/86400);return d+(d===1?' day ago':' days ago');}
function when(t){var d=new Date(t*1000),n=new Date();var same=d.toDateString()===n.toDateString();
  return (same?'Today ':d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' ')+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
function clock(t){return new Date(t*1000).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
var CATN={jackets:'Jackets',tops:'Shirts & polos',layers:'Layers & fleece',vests:'Vests',headwear:'Headwear',pants:'Pants',hivis:'Hi-vis',golf:'Golf',bags:'Bags',gifts:'Gifts'};
function catn(c){return CATN[c]||String(c||'').replace(/[-_]/g,' ').replace(/^./,function(x){return x.toUpperCase();});}
function pn(r){return r.kn?r.kn.split(' · ')[0]:(r.k?String(r.k).replace(/_/g,' '):'a product');}
var QN={who:'who wears it',look:'garment',warm:'warmth',wet:'weather',bud:'budget',style:'style',kind:'type',worn:'how it is worn',use:'season',for:'who it is for',wash:'laundry',cargo:'pockets',work:'type of work',fit:'fit',outer:'outer layer',twash:'laundry',vwork:'type of work',qty:'quantity'};
/* one plain-English line per thing a buyer did */
function say(r){var e=r.e,c=catn(r.c),q=r.q||'',v=r.v||'';
  switch(e){
  case'view':return'Opened the store';case'engaged':return'Started browsing';
  case'sheet':return'Looked at '+pn(r);case'add':return'Added '+pn(r)+' to their board';
  case'search':return'Searched “'+q+'”';case'search0':return'Searched “'+q+'” — nothing found';case'search_go':return'Ran a search';
  case'board':return'Opened their board';case'checkout':return'Opened checkout';case'sent':return r.src==='advisor'?('Requested free proofs + quote from the '+c+' advisor'):'Sent a quote request';
  case'quote_view':return'Viewed their quote';case'quote_pdf':return'Downloaded the quote PDF';case'quote_share':return'Shared the quote';
  case'quote_qty':case'quote_line_qty':return'Changed quantities';case'quote_sizes':case'quote_sizes_open':return'Set sizes';
  case'rfq_open':return'Opened “request a quote”';case'quote_open':return'Opened the quote';
  case'adv_go':case'ca_start':return'Started the '+c+' advisor';case'ca_q':return c+' advisor — '+(QN[q]||q)+(v?': '+v:'');
  case'ca_result':return'Got '+c+' recommendations';case'ca_add':return'Added the recommended '+c+' program to the quote';
  case'ca_add1':return'Added '+pn(r)+' from the advisor';case'ca_choose':return'Picked '+pn(r)+' in the comparison';
  case'ca_swap':return'Swapped a recommendation';case'ca_det':return'Compared options ('+c+')';case'ca_reset':return'Restarted the '+c+' advisor';
  case'ca_skip':return'Skipped a question';case'ca_col':return'Changed a colour';case'ca_qty':return'Set advisor quantities';
  case'market':return'Switched to '+(v||'').toUpperCase()+' pricing';case'aisle':return'Browsed '+String(r.k||'').replace(/-/g,' ');
  case'filter':return'Filtered the shelf';case'gift_open':return'Opened gifts';case'program':return'Opened a ready-made program';
  case'program_quote':return'Quoted a ready-made program';case'help_ask':case'faq_ask':case'hero_ask':case'xp_ask':return'Asked a question';
  case'xp_add':return'Added '+pn(r);case'xp_open':return'Opened '+pn(r);case'lead_focus':return'Started filling in their details';
  case'exit_show':return'Was about to leave';case'logo_home':return'Clicked the logo';
  }
  return e.replace(/_/g,' ');}
/* ---- data ---- */
function api(qs,body){
  var o=body?{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain'}}:{cache:'no-store'};
  return fetch(API+'?'+qs+'&key='+encodeURIComponent(KEY),o).then(function(r){if(r.status===403)throw new Error('key');return r.json();});
}
function load(){
  if(!KEY){gate();return;}
  actLoad();
  api('dash=1&days='+DAYS).then(function(d){D=d;LAST_OK=Date.now();alerts();var a=document.activeElement;if(a&&a.closest&&a.closest('.edit'))return;render();})
  .catch(function(e){if(String(e.message)==='key'){localStorage.removeItem('jdp_dash_key');KEY='';gate('That link has expired.');return;}
    var p=$('pulse');if(p){p.classList.add('off');p.lastChild.textContent=' Reconnecting…';}});
}
function schedule(){clearInterval(TIMER);TIMER=setInterval(function(){if(!document.hidden)load();},20000);}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()-LAST_OK>15000)load();});
function alerts(){

/* ACT:BEGIN js — "Today's revenue actions". Data: actions.enc.json beside this page, refreshed by
   tools/dash/refresh_actions.py from Airtable ACCOUNTS_V2 "Dash Actions". It is encrypted to this
   dashboard: the private key is derived here from KEY (the events.php key carried by Steven's link),
   so the public file is useless to anyone without the link. */
var ACT=null,ACT_ERR='',ACT_AT=0,ACT_BUSY=false,ACT_MORE={},ACT_FOLD=localStorage.getItem('jdp_dash_act_fold')==='1';
var ACT_PUB={x:'tX2z6qLrFdKTC6UxpydMWGUNk1eXnzRTpQz-VLQ76FY',y:'-hePCz-JpfULvFqV4YEKmB_wp083zT1mNHDFjtcsrM0'};
var ACT_G=[['REPLY','Reply','a buyer wrote back — answer today'],['EMAIL','Email','we need an address to send a built store'],
  ['CALL','Call','due call-backs, highest score first'],['VENDOR','Vendor','register on a procurement portal'],['NOTE','Your notes','from your own calls']];
function ub64(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function b64u(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function actDecrypt(env){
  var S=crypto.subtle,te=new TextEncoder(),EC={name:'ECDH',namedCurve:'P-256'},priv;
  return S.digest('SHA-256',te.encode('jdp-dash-actions-p256:'+KEY)).then(function(d){
    return S.importKey('jwk',{kty:'EC',crv:'P-256',x:ACT_PUB.x,y:ACT_PUB.y,d:b64u(new Uint8Array(d)),ext:true},EC,false,['deriveBits']);
  }).then(function(k){priv=k;return S.importKey('jwk',{kty:'EC',crv:'P-256',x:env.epk.x,y:env.epk.y,ext:true},EC,false,[]);
  }).then(function(epk){return S.deriveBits({name:'ECDH',public:epk},priv,256);
  }).then(function(sh){var a=new Uint8Array(sh),info=te.encode('jdp-dash-actions-v1'),m=new Uint8Array(a.length+info.length);m.set(a);m.set(info,a.length);return S.digest('SHA-256',m);
  }).then(function(k){return S.importKey('raw',k,'AES-GCM',false,['decrypt']);
  }).then(function(k){return S.decrypt({name:'AES-GCM',iv:ub64(env.iv)},k,ub64(env.ct));
  }).then(function(pt){return JSON.parse(new TextDecoder().decode(pt));});
}
function actLoad(force){
  if(!KEY||ACT_BUSY||(!force&&ACT&&Date.now()-ACT_AT<120000))return;
  if(!(window.crypto&&crypto.subtle)){ACT_ERR='This browser cannot unlock the actions (no WebCrypto).';return;}
  ACT_BUSY=true;
  fetch('actions.enc.json?c='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
  .then(actDecrypt).then(function(a){ACT=a;ACT_ERR='';ACT_AT=Date.now();})
  .catch(function(e){ACT_ERR=/http 404/.test(String(e))?'No actions published yet.':'Could not unlock the actions — reopen the dashboard from your latest emailed link.';ACT_AT=Date.now();})
  .then(function(){ACT_BUSY=false;var a=document.activeElement;if(D&&!(a&&a.closest&&a.closest('.edit')))render();});
}

function dueTxt(s){if(!s)return'';var d=new Date(s+'T12:00:00'),n=new Date();n.setHours(12,0,0,0);var k=Math.round((d-n)/86400000);
  var lab=d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  if(k<0)return'<div class="due late">Due '+esc(lab)+' · '+(-k)+(k===-1?' day':' days')+' overdue</div>';
  if(k===0)return'<div class="due now">Due today</div>';return'<div class="due">Due '+esc(lab)+(k===1?' · tomorrow':' · in '+k+' days')+'</div>';}

function actionsHtml(){
  if(!ACT){return'<section class="act"><div class="acth"><h2>Today’s revenue actions</h2><span class="mu">'+esc(ACT_ERR||'Unlocking…')+'</span></div></section>';}
  var S=ACT.summary||{},all=ACT.actions||[],todayN=all.filter(function(a){return a.today;}).length;
  var h='<section class="act"><div class="acth"><h2>Today’s revenue actions</h2><div class="acts">'
   +ACT_G.map(function(g){return'<span class="t-'+g[0]+'"><b>'+(S[g[0]]!=null?S[g[0]]:0)+'</b>'+g[1]+'</span>';}).join('')+'</div>'
   +'<span class="mu">'+todayN+' for today · generated '+esc(ACT.generated_at?when(Date.parse(ACT.generated_at)/1000):'—')+'</span>'
   +'<button class="actfold" data-actfold="1">'+(ACT_FOLD?'Show':'Hide')+'</button></div>';
  if(ACT.truncated)h+='<div class="actwarn"><b>Feed truncated:</b> showing '+(ACT.count||all.length)+' of '+(ACT.expected||'?')+' actions. The Airtable field hit its 100,000-character limit, so the rest (including any vendor registrations and notes) did not come through. The pipeline fix is in progress.</div>';
  if(ACT_FOLD)return h+'</section>';
  ACT_G.forEach(function(g){
    var it=all.filter(function(a){return a.type===g[0];});
    if(g[0]==='CALL')it.sort(function(a,b){return(b.score||0)-(a.score||0);});
    var exp=+(S[g[0]]||0);
    if(!it.length&&!exp)return;
    var now=it.filter(function(a){return a.today;}),later=it.filter(function(a){return!a.today;});
    h+='<div class="actg"><h3>'+g[1]+' <em>'+now.length+' today</em><i>'+g[2]+'</i></h3>';
    if(now.length)h+='<div class="actl">'+now.map(acard).join('')+'</div>';
    else if(it.length)h+='<div class="actstub">Nothing due today.</div>';
    if(later.length)h+='<details class="actmore" data-actmore="'+g[0]+'"'+(ACT_MORE[g[0]]?' open':'')+'><summary>Later this week · '+later.length+'</summary><div class="actl">'+later.map(acard).join('')+'</div></details>';
    if(exp>it.length)h+='<div class="actstub">'+(exp-it.length)+' more not shown (feed truncated).</div>';
    h+='</div>';
  });
  return h+'</section>';
}

   +'<p class="lbl" style="margin-top:18px">Top searches</p>'+tbl(['Search','Times'],Object.keys(I.searches||{}).slice(0,10).map(function(q){return[esc(q),I.searches[q]];}),'No searches yet.')+'</div>';
  var pr=(I.products||[]);
  var stuck=pr.filter(function(p){return p.opened>=3&&p.added===0;}).slice(0,10),win=pr.filter(function(p){return p.added>0;}).sort(function(a,b){return b.added-a.added;}).slice(0,8);
  h+='<div class="panel"><p class="lbl">Looked at often, never added</p>'+tbl(['Product','Opened','Added'],stuck.map(function(p){return[esc(p.name),p.opened,p.added];}),'Not enough product views yet.')
   +'<p class="lbl" style="margin-top:18px">Most added</p>'+tbl(['Product','Opened','Added'],win.map(function(p){return[esc(p.name),p.opened,p.added];}),'No adds yet.')+'</div></div>';
  var b=(I.bounce||[]).filter(function(x){return x.rate>=.6;});
  var refs=I.refs||{},dv=I.devices||{},tot=(dv.mobile||0)+(dv.desktop||0);
  h+='<div class="grid2"><div class="panel"><p class="lbl">Stores where visitors leave at the cover</p>'+tbl(['Store','Visits','Browsed'],b.slice(0,12).map(function(x){return[esc(x.client),x.sessions,x.engaged];}),'No store is losing most of its visitors at the cover.')+'</div>'
   +'<div class="panel"><p class="lbl">Where visitors come from</p>'+tbl(['Source','Visits'],Object.keys(refs).map(function(r){return[esc(r),refs[r]];}),'Mostly direct: email links and typed addresses (sources are recorded from today).')
   +(tot?'<p class="lbl" style="margin-top:18px">Device</p><p style="margin:0">Phone '+Math.round(100*(dv.mobile||0)/tot)+'% · Desktop '+Math.round(100*(dv.desktop||0)/tot)+'%</p>':'')+'</div></div>';
  return h;
}
function advTable(A){
  var ks=Object.keys(A).filter(function(c){var a=A[c];return(a.start||a.open||0)>0;}).sort(function(a,b){return(A[b].start||A[b].open||0)-(A[a].start||A[a].open||0);});
  if(!ks.length)return'<p class="mu">No advisor use in this window yet.</p>';
  return tbl(['Category','Started','Got picks','Added to quote','Gave up at'],ks.map(function(c){var a=A[c],st=a.start||a.open||0,qs=a.qs||{},qk=Object.keys(qs),last='',rs=a.result||0,ad=(a.add||0)+(a.add1||0);
    if(a.abandon&&qk.length){qk.sort(function(x,y){return qs[x]-qs[y];});last=(QN[qk[0]]||qk[0]);}
    return[esc(catn(c)),st,rs+(st?' <span class="mu">('+Math.round(100*rs/st)+'%)</span>':''),ad+(rs?' <span class="mu">('+Math.round(100*ad/rs)+'% of picks)</span>':''),a.abandon?esc(last||'—')+' <span class="mu">('+a.abandon+')</span>':'—'];}),'');
}
function tbl(head,rows,empty){
  if(!rows.length)return'<p class="mu" style="margin:0">'+esc(empty)+'</p>';
  return'<table><thead><tr>'+head.map(function(x,i){return'<th'+(i?' class="n"':'')+'>'+x+'</th>';}).join('')+'</tr></thead><tbody>'
    +rows.map(function(r){return'<tr>'+r.map(function(x,i){return'<td'+(i?' class="n"':'')+'>'+x+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
}
/* Plain recommendations, only from what the numbers show. */
function fixes(I){
  var out=[],f=I.funnel||{};
  (I.zero||[]).filter(function(z){return z.n>=2;}).slice(0,3).forEach(function(z){out.push(['Buyers searched “'+z.q+'” '+z.n+' times and found nothing','Add the product to the catalogue, or a search synonym that points to the closest item we carry.']);});
  if(f.view>=20&&f.engaged/f.view<.25)out.push([Math.round(100*(1-f.engaged/f.view))+'% of visits leave without scrolling or tapping','The cover is the problem: check it loads fast on phones and that the logo mockups show straight away.']);
  if(f.sheet>=10&&f.add/f.sheet<.08)out.push(['Only '+Math.round(100*f.add/f.sheet)+'% of visits that open a product go on to add one','Make “Add to board” the obvious next step on the product sheet and show the price per piece clearly.']);
  if(f.checkout>=3&&f.sent/f.checkout<.5)out.push([(f.checkout-f.sent)+' visits opened checkout but did not send','Shorten the request form, and call these stores first: they are on the Call list.']);
  var A=I.advisor||{};Object.keys(A).forEach(function(c){var a=A[c],st=a.start||0;if(st>=4&&(a.abandon||0)/st>=.4)out.push(['The '+catn(c)+' advisor loses '+Math.round(100*a.abandon/st)+'% of the people who start it','Look at the question where they stop (Advisor table) and make it optional or simpler.']);});
  (I.products||[]).filter(function(p){return p.opened>=6&&p.added===0;}).slice(0,2).forEach(function(p){out.push([p.name.split(' · ')[0]+' was opened '+p.opened+' times and never added','Check its photos, price and colours. It is attracting interest but not converting.']);});
  return out.slice(0,6);
}
/* ---- events ---- */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-tab],[data-tier],[data-edit],[data-mark],#staff,#notif');if(!t)return;
  if(t.dataset.tab){TAB=t.dataset.tab;localStorage.setItem('jdp_dash_tab',TAB);render();return;}
  if(t.dataset.tier){TIER=t.dataset.tier;render();return;}
  if(t.id==='staff'){SHOW_STAFF=!SHOW_STAFF;render();return;}
  if(t.id==='notif'){if(NOTIFY){NOTIFY=false;localStorage.removeItem('jdp_dash_notify');render();return;}
    Notification.requestPermission().then(function(p){NOTIFY=p==='granted';if(NOTIFY)localStorage.setItem('jdp_dash_notify','1');toast(NOTIFY?'You will get an alert when a company enters its store':'Alerts are blocked in this browser');render();});return;}
  if(t.dataset.edit){var k=t.dataset.edit;EDIT[k]=!EDIT[k];render();return;}
  if(t.dataset.mark){var kit=t.closest('[data-kit]').dataset.kit,s=t.dataset.mark,note='';
    if(s==='snooze')note=prompt('Note (optional)','')||'';
    api('mark=1',{kit:kit,s:s,note:note}).then(function(){toast(s==='clear'?'Cleared':s==='called'?'Marked as called':'Hidden until they come back');load();});}
});
document.addEventListener('toggle',function(ev){var d=ev.target;if(d.dataset&&d.dataset.tl)OPEN[d.dataset.tl]=d.open;},true);
document.addEventListener('change',function(ev){if(ev.target.id==='days'){DAYS=+ev.target.value;localStorage.setItem('jdp_dash_days',DAYS);load();}});
document.addEventListener('submit',function(ev){var fm=ev.target.closest('[data-form]');if(!fm)return;ev.preventDefault();
  var kit=fm.dataset.form,row={};['name','title','phone','email'].forEach(function(n){row[n]=fm.elements[n].value.trim();});
  var b={};b[kit]=row;api('contacts=1',b).then(function(){EDIT[kit]=false;toast('Contact saved');load();});});
load();schedule();
})();
</script>
