<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Store Leads · Just Deals Promotions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101418;--sub:#5b6470;--mute:#8a929c;--line:#e6e8eb;--soft:#f5f6f8;--bg:#fafbfc;--card:#fff;--acc:#d71f2b;--hot:#d71f2b;--hotbg:#fdecee;--warm:#b45309;--warmbg:#fef3e2;--cool:#475569;--coolbg:#eef1f5;--ok:#0f7b4f;--okbg:#e6f5ee;--live:#12a150}
*{box-sizing:border-box}html,body{margin:0}body{font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap}.brand i{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.q{flex:1;min-width:220px;position:relative}.q input{width:100%;border:1px solid #d5d9de;border-radius:10px;padding:10px 14px 10px 38px;font-size:15px;background:#fff}
.q input:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.q svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute)}
.ctl{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px;white-space:nowrap}.ctl select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);display:inline-block}
main{max-width:1080px;margin:0 auto;padding:22px 24px 60px}
h2{font-size:17px;margin:28px 0 4px;letter-spacing:-.01em}h2:first-child{margin-top:4px}.lede{color:var(--sub);margin:0 0 12px;font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:500;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}.btn.call{background:var(--ok);border-color:var(--ok);color:#fff}.btn.sm{padding:4px 9px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card.hot{border-left:4px solid var(--hot)}.card.warm{border-left:4px solid var(--warm)}.card.cool{border-left:4px solid var(--line)}.card.quiet{opacity:.6}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ch h3{margin:0;font-size:17px}
.num{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.lnk.big{font-size:17px;font-weight:700;color:var(--ink);text-decoration:none}.lnk.big:hover{text-decoration:underline}
.why{margin-top:6px;font-size:15px;font-weight:600}
.say{margin-top:10px;background:#f2f6ff;border:1px solid #dbe5fb;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5}.say span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#1a56c4;margin-bottom:2px}
.lab{font-size:12.5px;color:var(--sub);font-weight:600;align-self:center;margin-right:2px}.btn.won{border-color:var(--ok);color:var(--ok)}
.card.leaving{opacity:.35;transition:opacity .2s}
.hero{display:flex;align-items:baseline;gap:22px;flex-wrap:wrap;margin:0 0 14px}.hero>div{font-size:15px}.hero b{font-size:26px;letter-spacing:-.02em;margin-right:4px}.hero .mu{font-size:12.5px;flex:1;min-width:240px}
.facts{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--sub)}.facts b{color:var(--ink)}
.who div{margin-top:4px}.sub{margin-top:14px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}.mu{color:var(--mute)}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px}.pill.hot{background:var(--hotbg);color:var(--hot)}.pill.warm{background:var(--warmbg);color:var(--warm)}.pill.cool{background:var(--coolbg);color:var(--cool)}
.pill.live{background:var(--okbg);color:var(--ok)}.when{margin-left:auto;color:var(--mute);font-size:12.5px;white-space:nowrap}
.who{margin-top:6px;font-size:13.5px}.who b{font-weight:600}.who span{color:var(--sub)}
.did{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:3px;font-size:13.5px}.did li:before{content:'•';color:var(--mute);margin-right:7px}.did li.h{font-weight:600}.did li.h:before{color:var(--hot)}
.priced{margin-top:8px;background:var(--soft);border-radius:8px;padding:8px 10px;font-size:13px}.priced b{font-variant-numeric:tabular-nums}
.from{margin-top:8px;font-size:12.5px;color:var(--sub)}
.acts2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
details.tl{margin-top:10px}details.tl summary{cursor:pointer;color:var(--sub);font-size:13px;font-weight:600}
.visit{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:10px 0 0}.visit b{font-size:12.5px;color:var(--sub);font-weight:600}.visit div{font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);background:#fff;border-radius:10px;margin-bottom:6px}.row .mu{color:var(--mute);font-size:12.5px}.row .sp{flex:1}
table.src{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
table.src th,table.src td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}table.src th{background:var(--soft);font-weight:600;color:var(--sub);font-size:12px}
table.src td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}table.src th.n{text-align:right}table.src tr:last-child td{border-bottom:0}
.lnk{background:none;border:0;padding:0;color:#1a56c4;cursor:pointer;text-decoration:underline;font-size:12.5px}
.empty{padding:22px;text-align:center;color:var(--sub);background:#fff;border:1px dashed var(--line);border-radius:12px}
details.more>summary{cursor:pointer;font-weight:600;font-size:15px;margin:28px 0 10px;list-style:none}details.more>summary:before{content:'▸ ';color:var(--mute)}details.more[open]>summary:before{content:'▾ '}
.gate{max-width:460px;margin:12vh auto;text-align:center;padding:0 20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;opacity:0;transition:.2s;pointer-events:none;font-size:13px}.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:640px){.bar{padding:10px 14px}main{padding:16px 14px}.when{margin-left:0;width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
/* STORE LEADS v3 -- rebuilt from first principles (Steven, 2026-11-18: "re-think the dashboard from first principles and
   re create it. apollo is for tasks, not the dashboard").
   The page exists for one person and one job: win deals from store activity. So it answers, in this order:
     1. WHO DO I CALL NOW, AND WHAT DO I SAY?  A queue, not a report. Each card is a ready call: the person, their
        phone, why now, an opener built from what they did (never mentioning that we saw it), what they priced.
        One tap logs the outcome and the card leaves the queue until that company does something new.
     2. WHAT IS GOING ON WITH COMPANY X?  Search any company or person: every visit in plain English, people, what
        they priced, where they came from, and every call outcome logged here.
     3. IS THE OUTREACH WORKING?  Per email / newsletter edition: link opens -> real visits -> quote actions.
   Only real people count: email scanners, bare page loads and our own agents never appear. Tasks live in Apollo. */
var API='/kits/_api/events.php';
var KEY='',D=null,STORES=[],Q='',DAYS=+(localStorage.getItem('jdp_dash_days2')||30),ALL=false,LAST_OK=0,TIMER=null,OPEN={};
try{
  var m=/[#&]k=([a-f0-9]{32,})/i.exec(location.hash);
  if(m){localStorage.setItem('jdp_dash_key',m[1]);history.replaceState(null,'',location.pathname);}
  KEY=localStorage.getItem('jdp_dash_key')||'';
  localStorage.setItem('jdp_internal','1');          // this browser is staff: the stores never count it
  var qm=/[?&]q=([^&]+)/.exec(location.search);if(qm)Q=decodeURIComponent(qm[1].replace(/\+/g,' '));
}catch(e){}
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('on');},2200);}
function ago(t){var s=Math.max(0,Math.round(Date.now()/1000-t));if(s<90)return'just now';if(s<3600)return Math.round(s/60)+' min ago';
  if(s<86400)return Math.round(s/3600)+' h ago';var d=Math.round(s/86400);return d+(d===1?' day ago':' days ago');}
function when(t){var d=new Date(t*1000),n=new Date();var same=d.toDateString()===n.toDateString();
  return (same?'Today ':d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+', ')+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
function clock(t){return new Date(t*1000).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
var CATN={jackets:'jackets',tops:'shirts & polos',layers:'layers & fleece',vests:'vests',headwear:'headwear',pants:'pants',hivis:'hi-vis',golf:'golf',bags:'bags',gifts:'gifts',fr:'FR',team:'team uniform',event:'event'};
function catn(c){return CATN[c]||String(c||'').replace(/[-_]/g,' ');}
function pn(r){return r.kn?r.kn.split(' · ')[0]:(r.k?String(r.k).replace(/_/g,' '):'a product');}
/* the one plain-English line per thing a buyer did; null = not worth a line */
function say(r){var e=r.e,c=catn(r.c),q=r.q||'',v=r.v||'';
  switch(e){
  case'view':case'engaged':case'exit_show':case'logo_home':case'market_hint':case'filter_open':return null;
  case'sheet':return'Looked at '+pn(r);case'add':return'Added '+pn(r)+' to their quote';
  case'search':return'Searched “'+q+'”';case'search0':return'Searched “'+q+'”, and the store showed nothing';
  case'checkout':return'Opened checkout';case'sent':return'Sent a quote request';
  case'quote_view':return'Opened their quote'+(r.n?' ('+r.n+' item'+(r.n>1?'s':'')+')':'');case'quote_pdf':return'Downloaded the quote PDF';case'quote_share':return'Shared the quote with someone';
  case'quote_qty':case'quote_line_qty':return'Changed quantities';case'quote_sizes':return'Entered sizes';
  case'rfq_open':return'Opened "upload an RFQ"';case'adv_go':case'ca_start':return'Started the '+c+' advisor';
  case'ca_result':return'Got '+c+' recommendations';case'ca_add':return'Added the recommended '+c+' picks to their quote';
  case'ca_add1':return'Added '+pn(r)+' from the advisor';case'program':return'Opened a ready-made program';
  case'program_quote':return'Priced a ready-made program';case'program_share':return'Shared a program';
  case'help_ask':case'faq_ask':case'hero_ask':case'xp_ask':return'Asked us a question';
  case'gift_open':return'Looked at employee gifts';case'gift_quote':return'Started a gift quote';
  case'aisle':return'Browsed '+String(r.k||r.c||'').replace(/-/g,' ');case'xp_add':return'Added '+pn(r);
  case'sheet_quote':return'Started a quote from '+pn(r);case'market':return'Switched to '+String(v).toUpperCase()+' pricing';
  }
  return null;}
var SRCN={'ct:e0':'Store email','ct:e4':'Day-4 follow-up','ct:e10':'Day-10 follow-up','ct:cl':'Call-ladder email','ct:li':'LinkedIn','ct:nl':'Newsletter','ct:nu':'Nurture email','direct':'No tag (typed, bookmarked or forwarded)'};
function srcn(s){if(SRCN[s])return SRCN[s];if(s.indexOf('utm:')===0){var u=s.slice(4);return(/^nl/.test(u)?'Newsletter · ':'Link tag · ')+u;}return s.replace(/^ct:/,'Email step ');}
function telh(p){var n=String(p||'').split(/ext|\bx\s*\d|,|\//i)[0].replace(/[^\d+]/g,'');return n.length>=7?'tel:'+n:'';}
/* ---- data ---- */
function api(qs,body){
  var o=body?{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain'}}:{cache:'no-store'};
  return fetch(API+'?'+qs+'&key='+encodeURIComponent(KEY),o).then(function(r){if(r.status===403)throw new Error('key');return r.json();});
}
function load(){
  if(!KEY){gate();return;}
  api('dash=1&days='+DAYS).then(function(d){D=d;LAST_OK=Date.now();var a=document.activeElement;if(a&&a.id==='q'&&D._painted){paintBody();return;}render();})
  .catch(function(e){if(String(e.message)==='key'){localStorage.removeItem('jdp_dash_key');KEY='';gate('That link has expired.');}});
}
function loadStores(){if(!KEY)return;api('stores=1').then(function(j){STORES=j.stores||[];if(Q)paintBody();if(j.pending_names)setTimeout(loadStores,4000);}).catch(function(){});}
function gate(msg){
  $('app').innerHTML='<div class="gate"><h1>Store Leads</h1><p>'+esc(msg||'This page opens from the private link we email to Steven.')+'</p>'
   +'<button class="btn pri" id="sendlink">Email me the link</button><p style="margin-top:14px;font-size:12.5px;color:#8a929c">It goes only to steven@justdealspromotions.com.</p></div>';
  $('sendlink').onclick=function(){fetch(API+'?send=1').then(function(r){return r.json();}).then(function(j){toast(j.sent?'Sent. Check your inbox.':'Already sent within the hour. Check your inbox.');});};
}

/* ---- helpers on a lead ---- */
function isReal(l){return (l.real||0)>0||(l.priced&&l.priced.length)||(l.signals||[]).some(function(s){return s[0]==='h';});}
function person(l){
  var c=l.contact||{},p=(l.people||[]).filter(function(x){return x.name;}).sort(function(a,b){return b.last-a.last;})[0];
  return {name:(p&&p.name)||c.name||'',title:(p&&p.title)||c.title||'',phone:(p&&p.phone)||c.phone||'',email:(p&&p.email)||c.email||''};}
function co(l){return (l.contact&&l.contact.company)||l.client;}
function storeUrl(kit){return'https://justdealspromotions.com/kits/'+encodeURIComponent(kit)+'/?jdpstaff=1';}
function visits(l){
  var by={},order=[];(l.timeline||[]).forEach(function(r){var k=r.s||'?';if(!by[k]){by[k]={t:r.t,lines:[]};order.push(k);}
    var s=say(r);if(s&&by[k].lines.indexOf(s)<0)by[k].lines.push(s);by[k].t=Math.max(by[k].t,r.t);});
  return order.map(function(k){return by[k];}).filter(function(v){return v.lines.length;}).sort(function(a,b){return b.t-a.t;});}
function has(l,e){return (l.counts||{})[e]||0;}
function pname(p){return String(p.name||'').split(' · ')[0];}
/* why this company is worth a call right now: the single strongest thing, in a few words */
function why(l){
  if(has(l,'sent'))return'Sent a quote request';
  if(has(l,'checkout'))return'Opened checkout and stopped';
  if(has(l,'quote_pdf'))return'Downloaded a quote';
  if(l.forwarded)return'Passed the store on to a colleague';
  if(has(l,'quote_share')||has(l,'program_share'))return'Shared a quote';
  if(l.priced&&l.priced.length)return'Priced '+l.priced[0].qty+' × '+pname(l.priced[0]);
  if(has(l,'ca_add')||has(l,'ca_add1'))return'Took an advisor recommendation';
  var z=Object.keys(l.searches||{}).filter(function(q){return l.searches[q]==='search0';});if(z.length)return'Looked for “'+z[0]+'”, which the store doesn’t show';
  if(l.days>1)return'Came back on '+l.days+' different days';
  if(has(l,'add'))return'Added products to a quote';
  if(has(l,'sheet'))return'Looked at '+has(l,'sheet')+' product'+(has(l,'sheet')>1?'s':'');
  return'Browsed their store';}
/* the garment type only, never the model name, so the call never reads like we watched them browse */
function kind(n){n=String(n||'').toLowerCase();var K=[[/hoodie|hooded/,'hoodies'],[/quarter|1\/4|half-zip|1\/2/,'quarter-zips'],[/polo/,'polos'],[/vest/,'vests'],[/parka|softshell|jacket|shell|bomber|3-in-1/,'jackets'],
  [/t-shirt|\btee\b/,'t-shirts'],[/crew|sweatshirt|fleece/,'fleece'],[/shirt/,'shirts'],[/toque|beanie/,'toques'],[/cap|hat\b/,'caps'],[/pant|jogger|bib|coverall/,'work pants'],[/backpack|duffel|bag|cooler/,'bags'],[/hard hat/,'hard hats']];
  for(var i=0;i<K.length;i++)if(K[i][0].test(n))return K[i][1];return'branded gear';}
/* an opener that follows their interest without ever saying we watched them */
function opener(l){
  var who=person(l),hi='Hi'+(who.name?' '+who.name.split(' ')[0]:'')+', Steven from Just Deals. ';
  var z=Object.keys(l.searches||{}).filter(function(q){return l.searches[q]==='search0';});
  if(l.priced&&l.priced.length){var p=l.priced[0];return hi+'Quick one: are you looking at '+kind(pname(p))+' for the team this season? Happy to send free proofs with your logo and pricing.';}
  if(z.length)return hi+'Are you sourcing '+z[0]+' at the moment? We can get it for you, with proofs and a firm price.';
  var adv=Object.keys(l.advisor||{});if(adv.length)return hi+'Are you kitting the crew out with '+catn(adv[0])+' this season? Happy to put together a shortlist with your logo on it.';
  if(l.products&&l.products.length)return hi+'Are you planning any branded '+kind(String(l.products[0].name))+' for the team? I can send free proofs with your logo and exact pricing.';
  return hi+'Is branded gear for the team on your list this season? I can send free proofs with your logo, no obligation.';}
var OUT=[['talked','Talked: interested','called'],['vm','Left a voicemail','called'],['no','Not interested','snooze'],['won','Won the order','won']];
function outcomeTxt(c){var o=OUT.filter(function(x){return x[0]===c.note;})[0];return o?o[1]:({called:'Called',snooze:'Not now',won:'Won the order',clear:'Put back on the list',reply:'They replied',quote:'Quote sent',lost:'Lost',meeting:'Meeting booked'}[c.s]||c.s)+(c.note&&!o?' · '+c.note:'');}
function outcomesHtml(){return'<div class="acts2"><span class="lab">How did it go?</span>'+OUT.map(function(o){return'<button class="btn sm'+(o[0]==='won'?' won':'')+'" data-out="'+o[0]+'" data-s="'+o[2]+'">'+o[1]+'</button>';}).join('')+'</div>';}
function pricedHtml(l){return (l.priced&&l.priced.length)?'<div class="priced">They priced '+l.priced.map(function(p){return'<b>'+p.qty+'</b> × '+esc(pname(p))+(p.colour?' ('+esc(p.colour)+')':'');}).join(', ')+(l.priced_total?' · about <b>$'+Math.round(l.priced_total).toLocaleString()+'</b>':'')+'</div>':'';}
function callCard(l,i){
  var who=person(l),tel=telh(who.phone);
  return'<article class="card '+l.tier+'" data-kit="'+esc(l.kit)+'"><div class="ch"><span class="num">'+(i+1)+'</span><h3><button class="lnk big" data-find="'+esc(co(l))+'">'+esc(co(l))+'</button></h3>'
   +(l.live?'<span class="pill live"><span class="dot"></span> In the store now</span>':'')+'<span class="when">'+ago(l.last)+'</span></div>'
   +'<div class="why">'+esc(why(l))+'</div>'
   +'<div class="who">'+(who.name?'<b>'+esc(who.name)+'</b>'+(who.title?' <span>· '+esc(who.title)+'</span>':''):'<span>No contact name on file</span>')
     +(tel?' <a class="btn call sm" href="'+esc(tel)+'">Call '+esc(who.phone)+'</a>':(who.phone?' <span>· '+esc(who.phone)+'</span>':''))
     +(who.email?' <a class="btn sm" href="mailto:'+esc(who.email)+'">Email</a>':'')+'</div>'
   +'<div class="say"><span>Say</span>'+esc(opener(l))+'</div>'+pricedHtml(l)+outcomesHtml()+'</article>';}
/* ---- render ---- */
function render(){
  if(!D){$('app').innerHTML='<div class="gate"><p>Loading…</p></div>';return;}
  $('app').innerHTML='<div class="top"><div class="bar"><div class="brand"><i></i>Store Leads</div>'
   +'<label class="q"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
   +'<input id="q" type="search" placeholder="Search any company or person…" autocomplete="off" value="'+esc(Q)+'"></label>'
   +'<div class="ctl"><select id="days" aria-label="Time window">'+[[7,'Last 7 days'],[30,'Last 30 days'],[90,'Last 90 days']].map(function(o){return'<option value="'+o[0]+'"'+(o[0]===DAYS?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'
   +'<span><span class="dot"></span> '+clock(D.now)+'</span></div></div></div><main id="body"></main>';
  D._painted=1;paintBody();
}
function paintBody(){var el=$('body');if(!el)return;var y=window.scrollY;el.innerHTML=Q.trim()?searchHtml(Q.trim()):homeHtml();window.scrollTo(0,y);}
function homeHtml(){
  var leads=D.leads||[],queue=leads.filter(function(l){return isReal(l)&&!l.quiet;});
  var rk={hot:0,warm:1,cool:2};queue.sort(function(a,b){return (b.live-a.live)||(rk[a.tier]-rk[b.tier])||(b.score-a.score);});
  var t0=new Date();t0.setHours(0,0,0,0);t0=t0/1000;
  var done=leads.filter(function(l){return (l.calls||[]).some(function(c){return c.t>=t0&&c.by!=='ops';});});
  var h='<div class="hero"><div><b>'+queue.length+'</b> to call</div><div><b>'+done.length+'</b> done today</div>'
   +'<div class="mu">Real buyers only, last '+DAYS+' days. Email scanners, page loads and our own visits are left out.</div></div>';
  var show=ALL?queue:queue.slice(0,10);
  h+=show.length?show.map(callCard).join(''):'<div class="empty">Nobody to call right now. When a buyer does something in their store, they appear here and you get an email.</div>';
  if(!ALL&&queue.length>10)h+='<button class="btn" data-all="1">Show all '+queue.length+'</button>';
  if(done.length)h+='<details class="more"><summary>Done today ('+done.length+')</summary>'+done.map(function(l){var c=(l.calls||[])[0]||{};
     c=(l.calls||[]).filter(function(x){return x.by!=='ops';})[0]||c;
     return'<div class="row"><button class="lnk" data-find="'+esc(co(l))+'">'+esc(co(l))+'</button><span class="mu">'+esc(outcomeTxt(c))+' · '+clock(c.t)+'</span><span class="sp"></span><button class="btn sm" data-kit2="'+esc(l.kit)+'" data-undo="1">Back on the list</button></div>';}).join('')+'</details>';
  h+=sourcesHtml();
  return h;
}
function sourcesHtml(){
  var S=D.sources||{};Object.keys(D.sent_by_source||{}).forEach(function(k){if(!S[k])S[k]={opens:0,acted:0,quotes:0,stores:[]};});var keys=Object.keys(S).filter(function(k){return S[k].opens||(D.sent_by_source||{})[k];});
  if(!keys.length)return'';
  keys.sort(function(a,b){return(S[b].acted-S[a].acted)||(S[b].opens-S[a].opens);});
  var nm={};STORES.forEach(function(s){nm[s.kit]=s.client;});(D.leads||[]).forEach(function(l){nm[l.kit]=co(l);});
  return'<h2>Is the outreach working?</h2><p class="lede">Each email step and newsletter edition, last '+DAYS+' days. Link opens are every click, minus obvious email-scanner bursts. Real visits and quote actions are people doing something.</p>'
   +'<table class="src"><tr><th>Came from</th><th class="n">Emails sent</th><th class="n">Link opens</th><th class="n">Real visits</th><th class="n">Quote actions</th><th>Companies that did something</th></tr>'
   +keys.map(function(k){var v=S[k],st=v.stores||[];
     var sn=(D.sent_by_source||{})[k];
     return'<tr><td>'+esc(srcn(k))+'</td><td class="n">'+(sn!=null?sn:'<span class="mu">–</span>')+'</td><td class="n">'+v.opens+'</td><td class="n"><b>'+(v.acted||0)+'</b></td><td class="n">'+(v.quotes||0)+'</td><td>'
       +(st.length?st.slice(0,8).map(function(s){return'<button class="lnk" data-find="'+esc(nm[s]||s)+'">'+esc(nm[s]||s)+'</button>';}).join(', ')+(st.length>8?' +'+(st.length-8)+' more':''):'<span class="mu">none yet</span>')+'</td></tr>';}).join('')
   +'</table>';
}
/* a company, in full */
function companyHtml(l){
  var who=person(l),tel=telh(who.phone),V=visits(l),ppl=(l.people||[]).filter(function(p){return p.name;});
  var h='<article class="card co '+l.tier+'" data-kit="'+esc(l.kit)+'"><div class="ch"><h3>'+esc(co(l))+'</h3>'
   +(l.live?'<span class="pill live"><span class="dot"></span> In the store now</span>':'')
   +'<span class="when"><a class="btn sm" href="'+esc(storeUrl(l.kit))+'" target="_blank" rel="noopener">Open their store</a></span></div>'
   +'<div class="facts"><span><b>'+(l.real||0)+'</b> real visit'+((l.real||0)===1?'':'s')+'</span><span>last active <b>'+ago(l.last)+'</b></span>'
     +(l.forwarded?'<span><b>Shared</b> with a colleague</span>':'')+(l.sources&&l.sources.length?'<span>came from <b>'+l.sources.map(srcn).map(esc).join(', ')+'</b></span>':'')+'</div>';
  if(who.name||ppl.length)h+='<div class="who">'+(ppl.length?ppl:[who]).map(function(p){var t=telh(p.phone);return'<div><b>'+esc(p.name)+'</b>'+(p.title?' <span>· '+esc(p.title)+'</span>':'')
     +(t?' <a class="btn call sm" href="'+esc(t)+'">Call '+esc(p.phone)+'</a>':'')+(p.email?' <a class="btn sm" href="mailto:'+esc(p.email)+'">Email</a>':'')+'</div>';}).join('')+'</div>';
  if(!l.quiet&&isReal(l))h+='<div class="say"><span>Say</span>'+esc(opener(l))+'</div>';
  h+=pricedHtml(l);
  if(!l.quiet&&isReal(l))h+=outcomesHtml();
  if((l.sends||[]).length)h+='<div class="sub">Emails we sent</div>'+l.sends.map(function(x){return'<div class="visit"><b>'+esc(when(x.t))+'</b><div>'+esc(srcn((/^nl/.test(x.step)?'utm:':'ct:')+x.step))+(x.to?' to '+esc(x.to):'')+'</div></div>';}).join('');
  if((l.calls||[]).length)h+='<div class="sub">Calls and outcomes</div>'+l.calls.map(function(c){return'<div class="visit"><b>'+esc(when(c.t))+'</b><div>'+esc(outcomeTxt(c))+'</div></div>';}).join('');
  h+='<div class="sub">What they did, visit by visit</div>'+(V.length?V.slice(0,20).map(function(v){return'<div class="visit"><b>'+esc(when(v.t))+'</b>'+v.lines.slice(0,12).map(function(x){return'<div>'+esc(x)+'</div>';}).join('')+'</div>';}).join(''):'<div class="mu">Only page loads so far, nothing a person chose to do.</div>');
  if(l.quiet)h+='<div class="acts2"><button class="btn sm" data-mark="clear">Put back on the call list</button></div>';
  return h+'</article>';
}
function searchHtml(q){
  var t=q.toLowerCase(),leads=D.leads||[],seen={},hits=[];
  leads.forEach(function(l){var c=l.contact||{},hay=[l.client,l.kit,c.company,c.name].concat((l.people||[]).map(function(p){return p.name;})).join(' ').toLowerCase();
    if(hay.indexOf(t)>=0){hits.push(l);seen[l.kit]=1;}});
  var rest=STORES.filter(function(s){return!seen[s.kit]&&(s.client+' '+s.kit).toLowerCase().indexOf(t)>=0;}).slice(0,40);
  var n=hits.length+rest.length;
  var h='<div class="hero"><div><b>'+n+'</b> result'+(n===1?'':'s')+' for “'+esc(q)+'”</div><div class="mu">Activity covers the last '+DAYS+' days. Change the window at the top to look further back.</div><button class="btn sm" data-clear="1">Back to the call list</button></div>';
  h+=hits.map(companyHtml).join('');
  if(rest.length)h+=rest.map(function(s){return'<div class="row"><b>'+esc(s.client)+'</b><span class="mu">No real visits in the last '+DAYS+' days</span><span class="sp"></span><a class="btn sm" href="'+esc(storeUrl(s.kit))+'" target="_blank" rel="noopener">Open their store</a></div>';}).join('');
  if(!n)h+='<div class="empty">'+(STORES.length?'No company store matches that.':'Loading the store list…')+'</div>';
  return h;
}
/* ---- events ---- */
var qT=null;
function setQ(v){Q=v;var i=$('q');if(i&&i.value!==v)i.value=v;paintBody();try{history.replaceState(null,'',location.pathname+(Q.trim()?'?q='+encodeURIComponent(Q.trim()):''));}catch(e){}}
document.addEventListener('input',function(ev){if(ev.target.id!=='q')return;var v=ev.target.value;clearTimeout(qT);qT=setTimeout(function(){setQ(v);},120);});
document.addEventListener('change',function(ev){if(ev.target.id==='days'){DAYS=+ev.target.value;localStorage.setItem('jdp_dash_days2',DAYS);load();}});
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-out],[data-mark],[data-all],[data-find],[data-clear],[data-undo]');if(!t)return;
  if(t.dataset.all){ALL=true;paintBody();return;}
  if(t.dataset.find){setQ(t.dataset.find);window.scrollTo(0,0);return;}
  if(t.dataset.clear){setQ('');return;}
  var kit=t.dataset.kit2||(t.closest('[data-kit]')||{dataset:{}}).dataset.kit;if(!kit)return;
  var s,note='';
  if(t.dataset.out){s=t.dataset.s;note=t.dataset.out;}else if(t.dataset.undo){s='clear';}else s=t.dataset.mark;
  var card=t.closest('.card');if(card&&s!=='clear')card.classList.add('leaving');
  api('mark=1',{kit:kit,s:s,note:note}).then(function(){toast(s==='clear'?'Back on the call list':note==='won'?'Nice one. Logged as won':'Logged');load();});
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()-LAST_OK>15000)load();});

load();loadStores();TIMER=setInterval(function(){if(!document.hidden)load();},30000);
})();
</script>
